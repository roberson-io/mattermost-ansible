---
# Main playbook for Mattermost deployment
# Usage:
#   Local:      ansible-playbook -i inventory/local.ini site.yml
#   Production: ansible-playbook -i inventory/production.ini site.yml
#
# Tag-based deployment for Packer/Terraform integration:
#   Packer build:   ansible-playbook site.yml --tags "install,configure-base"
#   Terraform run:  ansible-playbook site.yml --tags "runtime-config,service-start"
#
# Tags:
#   install         - Package installation and software downloads
#   configure-base  - Base configuration (systemd units, directories, users)
#   runtime-config  - Runtime configuration (requires IPs, hostnames)
#   service-start   - Enable and start services

- name: Bootstrap Python dependencies
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: test -f /usr/bin/dnf && dnf install -y python3-libselinux || true
      changed_when: false

- name: Gather facts from all hosts
  hosts: all
  gather_facts: true
  tasks:
    - name: Debug database host facts
      ansible.builtin.debug:
        msg: "Host {{ inventory_hostname }} has IP {{ ansible_default_ipv4.address | default('NO IP FOUND') }}"
      when: "'database' in groups and inventory_hostname in groups['database']"

- name: Deploy PostgreSQL Database
  hosts: database
  become: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: postgresql

- name: Deploy MinIO Object Storage
  hosts: minio
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: minio
      when: >
        packer_build | default(false) | bool or
        enable_minio | default(false) | bool

- name: Deploy NFS Server
  hosts: nfs
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: nfs
      when: >
        packer_build | default(false) | bool or
        enable_nfs | default(false) | bool

- name: Deploy Redis Cache
  hosts: redis
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: redis
      when: packer_build | default(false) | bool or enable_redis | default(false)

- name: Deploy Elasticsearch Search
  hosts: elasticsearch
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: elasticsearch
      when: enable_elasticsearch | default(false)
      tags: ['install', 'configure-base', 'runtime-config', 'service-start']

- name: Deploy Mattermost Application
  hosts: app
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
      tags: ['always']

    - name: Validate NTP time synchronization for HA cluster
      when:
        - mattermost_enable_cluster | default(false)
        - groups.app | default([]) | length > 1
      block:
        - name: Check if chronyd is running (RedHat/Rocky)
          ansible.builtin.systemd:
            name: chronyd
          register: chronyd_status
          failed_when: false
          when: ansible_os_family == "RedHat"

        - name: Check if systemd-timesyncd is running (Debian/Ubuntu)
          ansible.builtin.systemd:
            name: systemd-timesyncd
          register: timesyncd_status
          failed_when: false
          when: ansible_os_family == "Debian"

        - name: Warn if time synchronization is not active
          ansible.builtin.debug:
            msg: "WARNING: Time synchronization service is not running. HA clusters require NTP synchronization."
          when: >
            (ansible_os_family == "RedHat" and (chronyd_status.status.ActiveState | default('inactive')) != 'active') or
            (ansible_os_family == "Debian" and (timesyncd_status.status.ActiveState | default('inactive')) != 'active')

        - name: Force time synchronization before deployment (RedHat/Rocky)
          ansible.builtin.command: chronyc makestep
          become: true
          changed_when: false
          when: ansible_os_family == "RedHat" and (chronyd_status.status.ActiveState | default('inactive')) == 'active'

        - name: Force time synchronization before deployment (Debian/Ubuntu)
          ansible.builtin.command: systemctl restart systemd-timesyncd
          become: true
          changed_when: false
          when: ansible_os_family == "Debian" and (timesyncd_status.status.ActiveState | default('inactive')) == 'active'

        - name: Wait for time to stabilize after sync
          ansible.builtin.pause:
            seconds: 2

        - name: Get current time on all nodes
          ansible.builtin.command: date +%s
          register: node_time
          changed_when: false

        - name: Set node time fact
          ansible.builtin.set_fact:
            my_node_time: "{{ node_time.stdout | int }}"

        - name: Collect all node times
          ansible.builtin.set_fact:
            all_node_times: "{{ ansible_play_hosts | map('extract', hostvars, 'my_node_time') | list }}"
          run_once: true

        - name: Calculate maximum time difference
          ansible.builtin.set_fact:
            max_time_diff: "{{ (all_node_times | map('int') | max) - (all_node_times | map('int') | min) }}"
          run_once: true

        - name: Fail if clock skew is too large
          ansible.builtin.fail:
            msg: >-
              CRITICAL: Clock skew detected! Maximum time difference between nodes is {{ max_time_diff }} seconds.
              S3/MinIO requires clocks to be synchronized within a few minutes.
              Please ensure chronyd/NTP is working correctly on all nodes.
          when: max_time_diff | int > 300
          run_once: true

        - name: Display time synchronization status
          ansible.builtin.debug:
            msg: "✓ Time synchronization OK - maximum clock skew is {{ max_time_diff }} seconds"
          run_once: true

    - name: Gather facts from database host
      ansible.builtin.setup:
      delegate_to: "{{ groups['database'][0] }}"
      delegate_facts: true
      when: groups.get('database', []) | length > 0
      tags: ['runtime-config']

    - name: Set database host from facts
      ansible.builtin.set_fact:
        mattermost_db_host: "{{ hostvars[groups['database'][0]]['ansible_default_ipv4']['address'] }}"
      when: groups.get('database', []) | length > 0
      tags: ['runtime-config']

    - name: Set site URL from facts (single node)
      ansible.builtin.set_fact:
        mattermost_site_url: "http://{{ ansible_default_ipv4.address }}:8065"
      when: groups.app | length == 1
      tags: ['runtime-config']

    - name: Set site URL from load balancer (HA cluster)
      ansible.builtin.set_fact:
        mattermost_site_url: "http://{{ hostvars[groups['loadbalancer'][0]]['ansible_default_ipv4']['address'] }}"
      when:
        - groups.app | length > 1
        - groups.get('loadbalancer', []) | length > 0
      tags: ['runtime-config']

    - name: Gather facts from rtcd host
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups.get('rtcd', []) }}"
      when:
        - enable_calls | default(false)
        - groups.get('rtcd', []) | length > 0
      tags: ['runtime-config']

    - name: Set rtcd URL for Mattermost Calls plugin
      ansible.builtin.set_fact:
        mattermost_calls_rtcd_url: "http://{{ hostvars[groups['rtcd'][0]]['ansible_default_ipv4']['address'] }}:8045"
      when:
        - enable_calls | default(false)
        - groups.get('rtcd', []) | length > 0
      tags: ['runtime-config']

    - name: Gather facts from minio host
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups.get('minio', []) }}"
      when:
        - enable_minio | default(false)
        - groups.get('minio', []) | length > 0
      tags: ['runtime-config']

    - name: Set MinIO host from facts
      ansible.builtin.set_fact:
        mattermost_minio_host: "{{ hostvars[groups['minio'][0]]['ansible_default_ipv4']['address'] }}"
      when:
        - enable_minio | default(false)
        - groups.get('minio', []) | length > 0
      tags: ['runtime-config']
  roles:
    - role: mattermost

- name: Deploy Load Balancer (nginx)
  hosts: loadbalancer
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false

    - name: Gather facts from all app nodes
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups.app | default([]) }}"
      when: groups.app | default([]) | length > 0

    - name: Build upstream servers list for nginx
      ansible.builtin.set_fact:
        nginx_upstream_servers: >-
          {{ groups.app | default([])
             | map('extract', hostvars, ['ansible_default_ipv4', 'address'])
             | map('regex_replace', '^(.*)$', '{"host": "\1", "port": 8065}')
             | map('from_json')
             | list }}
      when: groups.app | default([]) | length > 1

    - name: Set nginx to load balancer mode
      ansible.builtin.set_fact:
        nginx_mode: "load_balancer"
      when: groups.app | default([]) | length > 1
  roles:
    - role: nginx
      when: packer_build | default(false) | bool or use_nginx | default(false) or groups.app | default([]) | length > 1
    - role: certbot
      when: use_tls | default(false)
      tags: ['install', 'configure-base', 'runtime-config']

- name: Deploy RTCD Service
  hosts: rtcd
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false

  roles:
    - role: rtcd
      when: enable_calls | default(false)
      tags: ['install', 'configure-base', 'runtime-config', 'service-start']

- name: Deploy coturn TURN Server
  hosts: coturn
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: coturn
      when: enable_coturn | default(false)
      tags: ['install', 'configure-base', 'runtime-config', 'service-start']

- name: Deploy Prometheus Monitoring
  hosts: monitoring
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: prometheus
      when: enable_monitoring | default(false)
      tags: ['install', 'configure-base', 'runtime-config', 'service-start']

- name: Deploy Grafana Visualization
  hosts: monitoring
  become: true
  gather_facts: true
  roles:
    - role: grafana
      when: enable_monitoring | default(false)
      tags: ['install', 'configure-base', 'runtime-config', 'service-start']

- name: Deploy Node Exporter on Mattermost Servers
  hosts: app
  become: true
  gather_facts: true
  roles:
    - role: node_exporter
      when: enable_monitoring | default(false)
      tags: ['install', 'configure-base']

- name: Deploy calls-offloader Service
  hosts: calls_offloader
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false

  roles:
    - role: docker
    - role: calls-offloader
      when: >
        packer_build | default(false) | bool or
        (mattermost_calls_enable_recording | default(false) and enable_calls | default(false))

- name: Deploy Keycloak Service
  hosts: keycloak
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false

    - name: Gather facts from database host for Keycloak
      ansible.builtin.setup:
      delegate_to: "{{ groups['database'][0] }}"
      delegate_facts: true
      when: groups.get('database', []) | length > 0

    - name: Set Keycloak database host from facts
      ansible.builtin.set_fact:
        keycloak_db_host: "{{ hostvars[groups['database'][0]]['ansible_default_ipv4']['address'] }}"
      when: groups.get('database', []) | length > 0
  roles:
    - role: keycloak
      when: enable_keycloak | default(false)
      tags: ['install', 'configure-base', 'runtime-config', 'service-start']

- name: Deploy OpenLDAP Services
  hosts: ldap
  become: true
  gather_facts: true
  pre_tasks:
    - name: Install Python SELinux support (RedHat/Rocky)
      ansible.builtin.raw: dnf install -y python3-libselinux
      when: ansible_os_family == "RedHat"
      changed_when: false
  roles:
    - role: openldap
      when: enable_ldap | default(false)
      tags: ['install', 'configure-base', 'runtime-config', 'service-start']

- name: Display deployment information
  hosts: app
  become: false
  gather_facts: false
  tasks:
    - name: Gather facts from keycloak host
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups.get('keycloak', []) }}"
      when:
        - enable_keycloak | default(false)
        - groups.get('keycloak', []) | length > 0

    - name: Set Keycloak host from facts
      ansible.builtin.set_fact:
        keycloak_host: "{{ hostvars[groups['keycloak'][0]]['ansible_default_ipv4']['address'] }}"
      when:
        - enable_keycloak | default(false)
        - groups.get('keycloak', []) | length > 0

    - name: Gather facts from ldap hosts
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups.get('ldap', []) }}"
      when:
        - enable_ldap | default(false)
        - groups.get('ldap', []) | length > 0

    - name: Build LDAP hosts list
      ansible.builtin.set_fact:
        ldap_hosts: "{{ groups.get('ldap', []) | map('extract', hostvars, 'ansible_default_ipv4') | map(attribute='address') | list }}"
      when:
        - enable_ldap | default(false)
        - groups.get('ldap', []) | length > 0

    - name: Show access URL
      ansible.builtin.debug:
        msg:
          - "Mattermost deployment complete!"
          - "Access URL: {{ mattermost_site_url | default('http://localhost:8065') }}"
          - >-
            RTCD URL: {{ mattermost_calls_rtcd_url
            if (enable_calls | default(false) and mattermost_calls_rtcd_url is defined)
            else 'Not configured' }}
          - >-
            MinIO URL: {{ 'http://' + mattermost_minio_host + ':9000'
            if (enable_minio | default(false) and mattermost_minio_host is defined)
            else 'Not configured' }}
          - >-
            MinIO Console: {{ 'http://' + mattermost_minio_host + ':9001'
            if (enable_minio | default(false) and mattermost_minio_host is defined)
            else 'Not configured' }}
          - >-
            Keycloak URL: {{ 'http://' + keycloak_host + ':8080'
            if (enable_keycloak | default(false) and keycloak_host is defined)
            else 'Not configured' }}
          - >-
            OpenLDAP URLs: {{ ldap_hosts | map('regex_replace', '^(.*)$', 'ldap://\1:389') | join(', ')
            if (enable_ldap | default(false) and ldap_hosts is defined and ldap_hosts | length > 0)
            else 'Not configured' }}
          - >-
            Prometheus URL: {{ 'http://' + hostvars[groups['monitoring'][0]]['ansible_default_ipv4']['address'] + ':9090'
            if (enable_monitoring | default(false) and groups['monitoring'] is defined and groups['monitoring'] | length > 0)
            else 'Not configured' }}
          - >-
            Grafana URL: {{ 'http://' + hostvars[groups['monitoring'][0]]['ansible_default_ipv4']['address'] + ':3000'
            if (enable_monitoring | default(false) and groups['monitoring'] is defined and groups['monitoring'] | length > 0)
            else 'Not configured' }}
          - "Create your admin account on first visit"

- name: Apply DISA STIG Security Hardening (Audit)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: disa-stig
      when: disa_stig_enabled | default(false)
      tags: ['configure-base']

  post_tasks:
    - name: Find XCCDF report in temp directory
      ansible.builtin.find:
        paths: "/var/folders"
        patterns: "xccdf-results.xml"
        recurse: true
        file_type: file
        age: "-10m"
      register: xccdf_files
      delegate_to: localhost
      become: false
      run_once: true
      when: disa_stig_enabled | default(false)
      failed_when: false

    - name: Copy XCCDF report from temp to compliance-reports (runs on localhost)
      ansible.builtin.copy:
        src: "{{ xccdf_files.files[0].path }}"
        dest: >-
          {{ playbook_dir }}/compliance-reports/{{ deployment_environment | default('deployment') }}_{{
          disa_stig_provider | default('stig') }}_audit_{{ ansible_date_time.date }}.xml
        mode: "0644"
      delegate_to: localhost
      become: false
      run_once: true
      when:
        - disa_stig_enabled | default(false)
        - xccdf_files.files | default([]) | length > 0
      failed_when: false

    - name: Display STIG report location
      ansible.builtin.debug:
        msg: >-
          STIG compliance report saved to: compliance-reports/{{ deployment_environment | default('deployment') }}_{{
          disa_stig_provider | default('stig') }}_audit_{{ ansible_date_time.date }}.xml
      run_once: true
      when: disa_stig_enabled | default(false)
