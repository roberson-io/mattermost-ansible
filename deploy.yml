---
- name: Deploy PostgreSQL Database
  hosts: database
  become: yes
  vars:
    mattermost_db_name: mattermost
    mattermost_db_user: mmuser
    mattermost_db_password: "mmuser_password_change_me"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install PostgreSQL packages
      apt:
        name:
          - postgresql
          - postgresql-contrib
          - python3-psycopg2
        state: present

    - name: Start and enable PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Find PostgreSQL config directory
      find:
        paths: /etc/postgresql
        file_type: directory
        recurse: no
      register: pg_version_dirs

    - name: Set PostgreSQL version
      set_fact:
        pg_version: "{{ pg_version_dirs.files[0].path | basename }}"

    - name: Configure PostgreSQL to listen on all interfaces
      lineinfile:
        path: "/etc/postgresql/{{ pg_version }}/main/postgresql.conf"
        regexp: '^#?listen_addresses'
        line: "listen_addresses = '*'"
        state: present
      notify: restart postgresql

    - name: Configure PostgreSQL to allow remote connections
      lineinfile:
        path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
        line: "host    {{ mattermost_db_name }}    {{ mattermost_db_user }}    0.0.0.0/0    scram-sha-256"
        state: present
      notify: restart postgresql

    - name: Create Mattermost database
      become_user: postgres
      postgresql_db:
        name: "{{ mattermost_db_name }}"
        state: present

    - name: Create Mattermost database user
      become_user: postgres
      postgresql_user:
        name: "{{ mattermost_db_user }}"
        password: "{{ mattermost_db_password }}"
        state: present

    - name: Grant database privileges to Mattermost user
      become_user: postgres
      postgresql_privs:
        database: "{{ mattermost_db_name }}"
        role: "{{ mattermost_db_user }}"
        type: database
        privs: ALL
        state: present

    - name: Grant schema privileges to Mattermost user
      become_user: postgres
      postgresql_privs:
        database: "{{ mattermost_db_name }}"
        role: "{{ mattermost_db_user }}"
        type: schema
        objs: public
        privs: ALL
        state: present

  handlers:
    - name: restart postgresql
      systemd:
        name: postgresql
        state: restarted

- name: Deploy Mattermost Application
  hosts: app
  become: yes
  vars:
    mattermost_version: "10.12.0"
    mattermost_db_name: mattermost
    mattermost_db_user: mmuser
    mattermost_db_password: "mmuser_password_change_me"
    mattermost_install_path: /opt/mattermost
    db_host: "{{ hostvars[groups['database'][0]]['ansible_default_ipv4']['address'] }}"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - curl
          - tar
        state: present

    - name: Check if Mattermost is already installed
      stat:
        path: "{{ mattermost_install_path }}/bin/mattermost"
      register: mattermost_binary

    - name: Download Mattermost
      get_url:
        url: "https://releases.mattermost.com/{{ mattermost_version }}/mattermost-{{ mattermost_version }}-linux-amd64.tar.gz"
        dest: /tmp/mattermost.tar.gz
        mode: '0644'
      when: not mattermost_binary.stat.exists

    - name: Extract Mattermost
      unarchive:
        src: /tmp/mattermost.tar.gz
        dest: /opt
        remote_src: yes
        creates: "{{ mattermost_install_path }}"
      when: not mattermost_binary.stat.exists

    - name: Create Mattermost data directory
      file:
        path: "{{ mattermost_install_path }}/data"
        state: directory
        owner: mattermost
        group: mattermost
        mode: '0755'
      ignore_errors: yes

    - name: Create mattermost user
      user:
        name: mattermost
        system: yes
        shell: /bin/bash
        home: "{{ mattermost_install_path }}"
        createhome: no

    - name: Set Mattermost directory ownership
      file:
        path: "{{ mattermost_install_path }}"
        owner: mattermost
        group: mattermost
        recurse: yes

    - name: Configure Mattermost database connection
      lineinfile:
        path: "{{ mattermost_install_path }}/config/config.json"
        regexp: '"DataSource":'
        line: '        "DataSource": "postgres://{{ mattermost_db_user }}:{{ mattermost_db_password }}@{{ db_host }}:5432/{{ mattermost_db_name }}?sslmode=disable&connect_timeout=10",'
        backrefs: yes

    - name: Configure Mattermost site URL
      lineinfile:
        path: "{{ mattermost_install_path }}/config/config.json"
        regexp: '"SiteURL":'
        line: '    "SiteURL": "http://{{ ansible_default_ipv4.address }}:8065",'
        backrefs: yes

    - name: Create Mattermost systemd service
      copy:
        dest: /etc/systemd/system/mattermost.service
        content: |
          [Unit]
          Description=Mattermost
          After=network.target

          [Service]
          Type=notify
          ExecStart={{ mattermost_install_path }}/bin/mattermost
          TimeoutStartSec=3600
          KillMode=mixed
          Restart=always
          RestartSec=10
          WorkingDirectory={{ mattermost_install_path }}
          User=mattermost
          Group=mattermost
          LimitNOFILE=49152

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start Mattermost service
      systemd:
        name: mattermost
        state: started
        enabled: yes

    - name: Allow Mattermost port through firewall (if ufw is installed)
      community.general.ufw:
        rule: allow
        port: '8065'
        proto: tcp
      ignore_errors: yes

    - name: Display access information
      debug:
        msg:
          - "Mattermost installation complete!"
          - "Access Mattermost at: http://{{ ansible_default_ipv4.address }}:8065"
          - "Create your admin account on first visit"
