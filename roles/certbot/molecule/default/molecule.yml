---
dependency:
  enabled: false
  name: galaxy

driver:
  name: docker

platforms:
  - name: certbot-ubuntu
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        certbot_email: test@example.com
        certbot_domain: test.example.com
        certbot_create_if_missing: false # Don't actually create certs in test
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer, yaml
      host_key_checking: false
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ssh_connection:
      pipelining: false

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
