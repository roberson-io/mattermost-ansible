---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check certbot is installed
      ansible.builtin.package:
        name: certbot
        state: present
      check_mode: true
      register: pkg_check
      failed_when: pkg_check is changed

    - name: Check python3-certbot-nginx is installed
      ansible.builtin.package:
        name: python3-certbot-nginx
        state: present
      check_mode: true
      register: plugin_check
      failed_when: plugin_check is changed

    - name: Verify certbot command is available
      ansible.builtin.command: which certbot
      changed_when: false
      register: certbot_cmd
      failed_when: certbot_cmd.rc != 0

    - name: Verify certbot renewal cron job exists
      ansible.builtin.shell: set -o pipefail && crontab -l | grep -q "certbot renew"
      args:
        executable: /bin/bash
      changed_when: false
      register: cron_check
      failed_when: cron_check.rc != 0
