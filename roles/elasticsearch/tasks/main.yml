---
# Elasticsearch installation and configuration tasks

- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install Java runtime
  ansible.builtin.package:
    name: "{{ elasticsearch_java_package }}"
    state: present

- name: Install Elasticsearch dependencies
  ansible.builtin.package:
    name: "{{ elasticsearch_dependencies }}"
    state: present

- name: Setup Elasticsearch repository (Debian/Ubuntu)
  when: ansible_os_family == "Debian" and not elasticsearch_use_opensearch
  block:
    - name: Download Elasticsearch GPG key
      ansible.builtin.get_url:
        url: "{{ elasticsearch_gpg_key_url }}"
        dest: "{{ elasticsearch_gpg_key_path }}"
        mode: "0644"

    - name: Add Elasticsearch APT repository
      ansible.builtin.apt_repository:
        repo: "{{ elasticsearch_apt_repo }}"
        filename: "elasticsearch-{{ elasticsearch_major_version }}.x"
        state: present
        update_cache: true

- name: Setup Elasticsearch repository (RedHat/Rocky)
  when: ansible_os_family == "RedHat" and not elasticsearch_use_opensearch
  block:
    - name: Import Elasticsearch GPG key
      ansible.builtin.rpm_key:
        key: "{{ elasticsearch_gpg_key_url }}"
        state: present

    - name: Add Elasticsearch YUM repository
      ansible.builtin.yum_repository:
        name: "elasticsearch-{{ elasticsearch_major_version }}.x"
        description: "Elasticsearch repository for {{ elasticsearch_major_version }}.x packages"
        baseurl: "{{ elasticsearch_yum_repo_baseurl }}"
        gpgcheck: true
        gpgkey: "{{ elasticsearch_gpg_key_url }}"
        enabled: true

- name: Install Elasticsearch from repository
  ansible.builtin.package:
    name: "elasticsearch-{{ elasticsearch_version }}"
    state: present
  when: not elasticsearch_use_opensearch

- name: Install OpenSearch (alternative)
  when: elasticsearch_use_opensearch
  block:
    - name: Create OpenSearch system user
      ansible.builtin.user:
        name: "{{ elasticsearch_user }}"
        system: true
        shell: /sbin/nologin
        home: "{{ elasticsearch_data_path }}"
        create_home: false

    - name: Create OpenSearch directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ elasticsearch_user }}"
        group: "{{ elasticsearch_group }}"
        mode: "0755"
      loop:
        - "{{ elasticsearch_install_path }}"
        - "{{ elasticsearch_config_path }}"
        - "{{ elasticsearch_data_path }}"
        - "{{ elasticsearch_log_path }}"

    - name: Download OpenSearch
      ansible.builtin.get_url:
        url: "{{ opensearch_download_url }}"
        dest: "/tmp/opensearch-{{ opensearch_version }}.tar.gz"
        mode: "0644"

    - name: Extract OpenSearch
      ansible.builtin.unarchive:
        src: "/tmp/opensearch-{{ opensearch_version }}.tar.gz"
        dest: "{{ elasticsearch_install_path }}"
        remote_src: true
        owner: "{{ elasticsearch_user }}"
        group: "{{ elasticsearch_group }}"
        extra_opts: [--strip-components=1]

    - name: Clean up OpenSearch download
      ansible.builtin.file:
        path: "/tmp/opensearch-{{ opensearch_version }}.tar.gz"
        state: absent

- name: Create Elasticsearch directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: "0755"
  loop:
    - "{{ elasticsearch_data_path }}"
    - "{{ elasticsearch_log_path }}"

# Multi-node cluster discovery configuration
- name: Gather facts from all elasticsearch nodes
  ansible.builtin.setup:
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups.elasticsearch | default([]) }}"
  when:
    - elasticsearch_cluster_mode == "multi"
    - groups.elasticsearch is defined
    - groups.elasticsearch | length > 1
  run_once: true

- name: Build discovery seed hosts list
  ansible.builtin.set_fact:
    elasticsearch_discovery_seed_hosts: "{{ groups.elasticsearch | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | map('regex_replace', '^(.*)$', '\\1:' ~ elasticsearch_transport_port) | list }}"
  when:
    - elasticsearch_cluster_mode == "multi"
    - elasticsearch_discovery_seed_hosts | length == 0
    - groups.elasticsearch is defined
    - groups.elasticsearch | length > 1

- name: Build initial master nodes list
  ansible.builtin.set_fact:
    elasticsearch_initial_master_nodes: "{{ groups.elasticsearch | map('extract', hostvars, 'ansible_hostname') | list }}"
  when:
    - elasticsearch_cluster_mode == "multi"
    - elasticsearch_initial_master_nodes | length == 0
    - groups.elasticsearch is defined
    - groups.elasticsearch | length > 1

- name: Deploy Elasticsearch configuration
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: "{{ elasticsearch_config_path }}/elasticsearch.yml"
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: "0660"
  notify: restart elasticsearch

- name: Configure Elasticsearch JVM options
  ansible.builtin.template:
    src: jvm.options.j2
    dest: "{{ elasticsearch_config_path }}/jvm.options.d/heap.options"
    owner: "{{ elasticsearch_user }}"
    group: "{{ elasticsearch_group }}"
    mode: "0660"
  notify: restart elasticsearch

- name: Install ICU Analysis plugin
  when: elasticsearch_install_icu_plugin
  block:
    - name: Check if ICU plugin is already installed
      ansible.builtin.command: "{{ elasticsearch_install_path }}/bin/elasticsearch-plugin list"
      register: installed_plugins
      changed_when: false
      failed_when: false

    - name: Install ICU Analysis plugin
      ansible.builtin.command: "{{ elasticsearch_install_path }}/bin/elasticsearch-plugin install analysis-icu --batch"
      when: "'analysis-icu' not in installed_plugins.stdout"
      notify: restart elasticsearch

- name: Configure firewall for Elasticsearch
  when: elasticsearch_firewall_enabled
  block:
    - name: Check if firewalld is available
      ansible.builtin.systemd:
        name: firewalld
      register: firewalld_service
      failed_when: false

    - name: Configure firewalld for Elasticsearch
      when: firewalld_service.status.ActiveState == "active"
      block:
        - name: Open Elasticsearch HTTP port in firewalld (temporary)
          ansible.posix.firewalld:
            port: "{{ elasticsearch_http_port }}/tcp"
            permanent: false
            state: enabled
            immediate: true

        - name: Open Elasticsearch HTTP port in firewalld (permanent)
          ansible.posix.firewalld:
            port: "{{ elasticsearch_http_port }}/tcp"
            permanent: true
            state: enabled

        - name: Open Elasticsearch transport port in firewalld (temporary)
          ansible.posix.firewalld:
            port: "{{ elasticsearch_transport_port }}/tcp"
            permanent: false
            state: enabled
            immediate: true

        - name: Open Elasticsearch transport port in firewalld (permanent)
          ansible.posix.firewalld:
            port: "{{ elasticsearch_transport_port }}/tcp"
            permanent: true
            state: enabled

        - name: Configure rich rules for allowed sources (HTTP)
          ansible.posix.firewalld:
            rich_rule: "rule family=ipv4 source address={{ item }} port port={{ elasticsearch_http_port }} protocol=tcp accept"
            permanent: true
            state: enabled
            immediate: true
          loop: "{{ elasticsearch_firewall_allowed_sources }}"
          when: elasticsearch_firewall_allowed_sources | length > 0

        - name: Configure rich rules for allowed sources (transport)
          ansible.posix.firewalld:
            rich_rule: "rule family=ipv4 source address={{ item }} port port={{ elasticsearch_transport_port }} protocol=tcp accept"
            permanent: true
            state: enabled
            immediate: true
          loop: "{{ elasticsearch_firewall_allowed_sources }}"
          when: elasticsearch_firewall_allowed_sources | length > 0

        - name: Allow inter-node communication (multi-node cluster)
          ansible.posix.firewalld:
            rich_rule: "rule family=ipv4 source address={{ item }} port port={{ elasticsearch_transport_port }} protocol=tcp accept"
            permanent: true
            state: enabled
            immediate: true
          loop: "{{ elasticsearch_discovery_seed_hosts | map('regex_replace', ':(\\d+)$', '') | list }}"
          when:
            - elasticsearch_cluster_mode == "multi"
            - elasticsearch_discovery_seed_hosts | length > 0

    - name: Configure ufw for Elasticsearch (Ubuntu/Debian)
      when: ansible_os_family == "Debian"
      block:
        - name: Allow Elasticsearch HTTP port in ufw
          community.general.ufw:
            rule: allow
            port: "{{ elasticsearch_http_port }}"
            proto: tcp
          when: elasticsearch_firewall_allowed_sources | length == 0

        - name: Allow Elasticsearch transport port in ufw
          community.general.ufw:
            rule: allow
            port: "{{ elasticsearch_transport_port }}"
            proto: tcp
          when: elasticsearch_firewall_allowed_sources | length == 0

        - name: Allow Elasticsearch HTTP port from specific sources
          community.general.ufw:
            rule: allow
            port: "{{ elasticsearch_http_port }}"
            proto: tcp
            from_ip: "{{ item }}"
          loop: "{{ elasticsearch_firewall_allowed_sources }}"
          when: elasticsearch_firewall_allowed_sources | length > 0

        - name: Allow Elasticsearch transport port from specific sources
          community.general.ufw:
            rule: allow
            port: "{{ elasticsearch_transport_port }}"
            proto: tcp
            from_ip: "{{ item }}"
          loop: "{{ elasticsearch_firewall_allowed_sources }}"
          when: elasticsearch_firewall_allowed_sources | length > 0

        - name: Allow inter-node communication (multi-node cluster)
          community.general.ufw:
            rule: allow
            port: "{{ elasticsearch_transport_port }}"
            proto: tcp
            from_ip: "{{ item }}"
          loop: "{{ elasticsearch_discovery_seed_hosts | map('regex_replace', ':(\\d+)$', '') | list }}"
          when:
            - elasticsearch_cluster_mode == "multi"
            - elasticsearch_discovery_seed_hosts | length > 0

- name: Enable and start Elasticsearch service
  ansible.builtin.systemd:
    name: elasticsearch
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for Elasticsearch to start
  ansible.builtin.wait_for:
    host: "{{ elasticsearch_network_host }}"
    port: "{{ elasticsearch_http_port }}"
    delay: 5
    timeout: 300

- name: Verify Elasticsearch is responding
  ansible.builtin.uri:
    url: "http://localhost:{{ elasticsearch_http_port }}"
    method: GET
    user: "{{ elasticsearch_username if elasticsearch_enable_security == 'true' else omit }}"
    password: "{{ elasticsearch_password if elasticsearch_enable_security == 'true' else omit }}"
    force_basic_auth: "{{ elasticsearch_enable_security == 'true' }}"
    status_code: 200
  register: es_health_check
  retries: 5
  delay: 10
  until: es_health_check is succeeded
