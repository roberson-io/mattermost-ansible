---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

  tags: ['install']
- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

# Add official PostgreSQL repositories
  tags: ['install']
- name: Install required packages for repository (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - gnupg
      - ca-certificates
    state: present
  when: ansible_os_family == "Debian"

  tags: ['install']
- name: Add PostgreSQL APT key (Debian/Ubuntu)
  ansible.builtin.get_url:
    url: "{{ postgresql_apt_key_url }}"
    dest: /usr/share/keyrings/postgresql-archive-keyring.asc
    mode: '0644'
  when: ansible_os_family == "Debian"

  tags: ['install']
- name: Add PostgreSQL APT repository (Debian/Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.asc] {{ postgresql_apt_repository.split('deb ')[1] }}"
    state: present
    filename: pgdg
    update_cache: true
  when: ansible_os_family == "Debian"

  tags: ['install']
- name: Add PostgreSQL RPM repository (RedHat)
  ansible.builtin.dnf:
    name: "{{ postgresql_rpm_repo_url }}"
    state: present
    disable_gpg_check: true
  when: ansible_os_family == "RedHat"

  tags: ['install']
- name: Disable built-in PostgreSQL module (RedHat 8+)
  ansible.builtin.shell: dnf -qy module disable postgresql
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when:
    - ansible_os_family == "RedHat"
    - ansible_distribution_major_version | int >= 8

# Check for existing PostgreSQL installation
  tags: ['install']
- name: Check if PostgreSQL is already installed (Debian/Ubuntu)
  ansible.builtin.shell: |
    set -o pipefail
    psql --version 2>/dev/null | awk '{print $3}' | cut -d. -f1
  args:
    executable: /bin/bash
  register: postgresql_current_version_debian
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Debian"

  tags: ['install']
- name: Check if PostgreSQL is already installed (RedHat)
  ansible.builtin.shell: |
    set -o pipefail
    /usr/pgsql-*/bin/postgres --version 2>/dev/null | awk '{print $3}' | cut -d. -f1 | head -1
  args:
    executable: /bin/bash
  register: postgresql_current_version_redhat
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"

  tags: ['install']
- name: Set PostgreSQL version facts
  ansible.builtin.set_fact:
    postgresql_installed_version: >-
      {{ (postgresql_current_version_debian.stdout | default('')) if ansible_os_family == 'Debian'
      else (postgresql_current_version_redhat.stdout | default('')) }}
    postgresql_is_installed: >-
      {{ (postgresql_current_version_debian.rc == 0 if ansible_os_family == 'Debian'
      else postgresql_current_version_redhat.rc == 0) }}

  tags: ['install']
- name: Set version comparison facts
  ansible.builtin.set_fact:
    postgresql_needs_install: "{{ not postgresql_is_installed }}"
    postgresql_needs_upgrade: >-
      {{ postgresql_is_installed and postgresql_installed_version != postgresql_version }}

  tags: ['install']
- name: Display version information
  ansible.builtin.debug:
    msg:
      - "Current PostgreSQL version: {{ postgresql_installed_version | default('none') }}"
      - "Desired PostgreSQL version: {{ postgresql_version }}"
      - >-
        Action needed: {{ 'fresh install' if postgresql_needs_install
        else ('upgrade/downgrade' if postgresql_needs_upgrade
        else 'none (already at desired version)') }}

# Backup and upgrade/downgrade logic
  tags: ['install']
- name: Handle PostgreSQL upgrade/downgrade
  when: postgresql_needs_upgrade
  block:
    - name: Stop PostgreSQL service
      ansible.builtin.systemd:
        name: "{{ 'postgresql' if ansible_os_family == 'Debian' else 'postgresql-' + postgresql_installed_version }}"
        state: stopped

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ postgresql_backup_dir }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"

    - name: Backup all databases before upgrade/downgrade
      ansible.builtin.command:
        cmd: >
          su - postgres -c "/usr/{{ 'lib/postgresql/' + postgresql_installed_version if ansible_os_family == 'Debian'
          else 'pgsql-' + postgresql_installed_version }}/bin/pg_dumpall >
          {{ postgresql_backup_dir }}/postgresql-all-backup-{{ ansible_date_time.iso8601_basic_short }}.sql"
      changed_when: true
      register: postgresql_backup_result

    - name: Display backup location
      ansible.builtin.debug:
        msg: "PostgreSQL backup created: {{ postgresql_backup_dir }}/postgresql-all-backup-{{ ansible_date_time.iso8601_basic_short }}.sql"

    - name: Backup PostgreSQL data directory (Debian/Ubuntu)
      ansible.builtin.copy:
        src: "/var/lib/postgresql/{{ postgresql_installed_version }}/"
        dest: "/var/lib/postgresql/{{ postgresql_installed_version }}-backup-{{ ansible_date_time.date }}"
        remote_src: true
        owner: postgres
        group: postgres
        mode: preserve
      when: ansible_os_family == "Debian"
      register: postgresql_debian_backup

    - name: Backup PostgreSQL data directory (RedHat)
      ansible.builtin.copy:
        src: "/var/lib/pgsql/{{ postgresql_installed_version }}/"
        dest: "/var/lib/pgsql/{{ postgresql_installed_version }}-backup-{{ ansible_date_time.date }}"
        remote_src: true
        owner: postgres
        group: postgres
        mode: preserve
      when: ansible_os_family == "RedHat"
      register: postgresql_redhat_backup

# Install PostgreSQL packages
  tags: ['install']
- name: Install PostgreSQL packages
  ansible.builtin.package:
    name: "{{ postgresql_packages }}"
    state: present

  tags: ['install']
- name: Initialize PostgreSQL database (RedHat)
  ansible.builtin.command: "/usr/pgsql-{{ postgresql_version }}/bin/postgresql-{{ postgresql_version }}-setup initdb"
  args:
    creates: "{{ postgresql_config_dir }}/postgresql.conf"
  when:
    - ansible_os_family == "RedHat"
    - postgresql_needs_install

# Data migration for upgrades
  tags: ['configure-base']
- name: Perform data migration after upgrade
  when:
    - postgresql_needs_upgrade
    - postgresql_backup_result is defined
  block:
    - name: Initialize new PostgreSQL cluster (RedHat)
      ansible.builtin.command: "/usr/pgsql-{{ postgresql_version }}/bin/postgresql-{{ postgresql_version }}-setup initdb"
      args:
        creates: "{{ postgresql_config_dir }}/postgresql.conf"
      when: ansible_os_family == "RedHat"

    - name: Ensure new PostgreSQL cluster exists (Debian/Ubuntu)
      ansible.builtin.command: "/usr/lib/postgresql/{{ postgresql_version }}/bin/initdb -D /var/lib/postgresql/{{ postgresql_version }}/main"
      become: true
      become_user: postgres
      args:
        creates: "/var/lib/postgresql/{{ postgresql_version }}/main/PG_VERSION"
      when: ansible_os_family == "Debian"

    - name: Start new PostgreSQL service temporarily for restoration
      ansible.builtin.systemd:
        name: "{{ postgresql_service_name }}"
        state: started
        enabled: true

    - name: Wait for PostgreSQL to be ready
      ansible.builtin.wait_for:
        port: 5432
        delay: 2
        timeout: 30

    - name: Restore databases from backup
      ansible.builtin.shell: >
        su - postgres -c "psql -f {{ postgresql_backup_dir }}/postgresql-all-backup-{{ ansible_date_time.iso8601_basic_short }}.sql postgres"
      changed_when: true
      register: postgresql_restore_result

    - name: Display restoration result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "PostgreSQL upgrade/downgrade complete!"
          - "Previous version: {{ postgresql_installed_version }}"
          - "New version: {{ postgresql_version }}"
          - "Backup location: {{ postgresql_backup_dir }}/postgresql-all-backup-{{ ansible_date_time.iso8601_basic_short }}.sql"
          - "Data backup: {{ postgresql_debian_backup.dest | default(postgresql_redhat_backup.dest | default('N/A')) }}"
          - "=========================================="

# Start PostgreSQL for fresh installs
  tags: ['configure-base']
- name: Start and enable PostgreSQL
  ansible.builtin.systemd:
    name: "{{ postgresql_service_name }}"
    state: started
    enabled: true
  when: postgresql_needs_install

  tags: ['configure-base']
- name: Find PostgreSQL config file (Debian/Ubuntu)
  ansible.builtin.find:
    paths: "{{ postgresql_config_dir }}"
    patterns: "postgresql.conf"
    recurse: true
  register: postgresql_config_files
  when: ansible_os_family == "Debian"

  tags: ['runtime-config']
- name: Set PostgreSQL config path (Debian/Ubuntu)
  ansible.builtin.set_fact:
    postgresql_conf_path: "{{ postgresql_config_files.files[0].path }}"
    postgresql_hba_path: "{{ postgresql_config_files.files[0].path | dirname }}/pg_hba.conf"
  when: ansible_os_family == "Debian"

  tags: ['runtime-config']
- name: Set PostgreSQL config path (RedHat)
  ansible.builtin.set_fact:
    postgresql_conf_path: "{{ postgresql_config_file }}"
    postgresql_hba_path: "{{ postgresql_hba_file }}"
  when: ansible_os_family == "RedHat"

  tags: ['runtime-config']
- name: Configure PostgreSQL password encryption to scram-sha-256
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?password_encryption"
    line: "password_encryption = scram-sha-256"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL to listen on all interfaces
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
    state: present
  notify: Restart postgresql
  when: postgresql_allow_remote

  tags: ['runtime-config']
- name: Configure PostgreSQL max_connections
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?max_connections"
    line: "max_connections = {{ postgresql_max_connections }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL shared_buffers
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?shared_buffers"
    line: "shared_buffers = {{ postgresql_shared_buffers }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL effective_cache_size
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?effective_cache_size"
    line: "effective_cache_size = {{ postgresql_effective_cache_size }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL work_mem
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?work_mem"
    line: "work_mem = {{ postgresql_work_mem }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL maintenance_work_mem
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?maintenance_work_mem"
    line: "maintenance_work_mem = {{ postgresql_maintenance_work_mem }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL random_page_cost
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?random_page_cost"
    line: "random_page_cost = {{ postgresql_random_page_cost }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL autovacuum_max_workers
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?autovacuum_max_workers"
    line: "autovacuum_max_workers = {{ postgresql_autovacuum_max_workers }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL max_worker_processes
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?max_worker_processes"
    line: "max_worker_processes = {{ postgresql_max_worker_processes }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL wal_level
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?wal_level"
    line: "wal_level = {{ postgresql_wal_level }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL max_wal_senders
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?max_wal_senders"
    line: "max_wal_senders = {{ postgresql_max_wal_senders }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL wal_keep_size
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?wal_keep_size"
    line: "wal_keep_size = {{ postgresql_wal_keep_size }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL hot_standby
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?\\s*hot_standby\\s*="
    line: "hot_standby = {{ postgresql_hot_standby }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL hot_standby_feedback
  ansible.builtin.lineinfile:
    path: "{{ postgresql_conf_path }}"
    regexp: "^#?\\s*hot_standby_feedback\\s*="
    line: "hot_standby_feedback = {{ postgresql_hot_standby_feedback }}"
    state: present
  notify: Restart postgresql

  tags: ['runtime-config']
- name: Configure PostgreSQL to allow remote connections for Mattermost
  ansible.builtin.lineinfile:
    path: "{{ postgresql_hba_path }}"
    line: "host    {{ postgresql_db_name }}    {{ postgresql_db_user }}    0.0.0.0/0    scram-sha-256"
    state: present
  notify: Restart postgresql
  when: postgresql_allow_remote

  tags: ['runtime-config']
- name: Configure PostgreSQL to allow remote connections for Keycloak
  ansible.builtin.lineinfile:
    path: "{{ postgresql_hba_path }}"
    line: "host    {{ keycloak_db_name | default('keycloak') }}    {{ keycloak_db_user | default('keycloak') }}    0.0.0.0/0    scram-sha-256"
    state: present
  notify: Restart postgresql
  when:
    - postgresql_allow_remote
    - keycloak_db_name is defined
    - keycloak_db_user is defined

  tags: ['runtime-config']
- name: Flush handlers to ensure PostgreSQL is restarted
  ansible.builtin.meta: flush_handlers

  tags: ['runtime-config']
- name: Wait for PostgreSQL to be ready after configuration
  ansible.builtin.wait_for:
    port: 5432
    delay: 2
    timeout: 30

  tags: ['runtime-config']
- name: Configure firewall for PostgreSQL
  when: postgresql_firewall_enabled
  block:
    - name: Check if firewalld is available
      ansible.builtin.systemd:
        name: firewalld
      register: postgresql_firewalld_service
      failed_when: false

    - name: Configure firewalld for PostgreSQL
      when: postgresql_firewalld_service.status.ActiveState == "active"
      block:
        - name: Open PostgreSQL port in firewalld (temporary)
          ansible.posix.firewalld:
            port: "5432/tcp"
            permanent: false
            state: enabled
            immediate: true

        - name: Open PostgreSQL port in firewalld (permanent)
          ansible.posix.firewalld:
            port: "5432/tcp"
            permanent: true
            state: enabled

        - name: Configure rich rules for allowed sources
          ansible.posix.firewalld:
            rich_rule: "rule family=ipv4 source address={{ item }} port port=5432 protocol=tcp accept"
            permanent: true
            state: enabled
            immediate: true
          loop: "{{ postgresql_firewall_allowed_sources }}"
          when: postgresql_firewall_allowed_sources | length > 0

    - name: Configure ufw for PostgreSQL (Ubuntu/Debian)
      when: ansible_os_family == "Debian"
      block:
        - name: Allow PostgreSQL port in ufw
          community.general.ufw:
            rule: allow
            port: "5432"
            proto: tcp
          when: postgresql_firewall_allowed_sources | length == 0

        - name: Allow PostgreSQL port from specific sources
          community.general.ufw:
            rule: allow
            port: "5432"
            proto: tcp
            from_ip: "{{ item }}"
          loop: "{{ postgresql_firewall_allowed_sources }}"
          when: postgresql_firewall_allowed_sources | length > 0

  tags: ['runtime-config']
- name: Create Mattermost database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgresql_db_name }}"
    state: present

  tags: ['runtime-config']
- name: Create Mattermost database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgresql_db_user }}"
    password: "{{ postgresql_db_password }}"
    encrypted: true
    state: present
  environment:
    PGOPTIONS: "-c password_encryption=scram-sha-256"

  tags: ['runtime-config']
- name: Grant database privileges to Mattermost user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    login_db: "{{ postgresql_db_name }}"
    role: "{{ postgresql_db_user }}"
    type: database
    privs: ALL
    state: present

  tags: ['runtime-config']
- name: Grant schema privileges to Mattermost user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    login_db: "{{ postgresql_db_name }}"
    role: "{{ postgresql_db_user }}"
    type: schema
    objs: public
    privs: ALL
    state: present

  tags: ['runtime-config']
# Keycloak database setup
- name: Create Keycloak database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ keycloak_db_name }}"
    state: present
  when:
    - keycloak_db_name is defined
    - keycloak_db_user is defined
    - keycloak_db_password is defined

  tags: ['runtime-config']
- name: Create Keycloak database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ keycloak_db_user }}"
    password: "{{ keycloak_db_password }}"
    encrypted: true
    state: present
  environment:
    PGOPTIONS: "-c password_encryption=scram-sha-256"
  when:
    - keycloak_db_name is defined
    - keycloak_db_user is defined
    - keycloak_db_password is defined

  tags: ['runtime-config']
- name: Grant database privileges to Keycloak user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    login_db: "{{ keycloak_db_name }}"
    role: "{{ keycloak_db_user }}"
    type: database
    privs: ALL
    state: present
  when:
    - keycloak_db_name is defined
    - keycloak_db_user is defined
    - keycloak_db_password is defined

  tags: ['runtime-config']
- name: Grant schema privileges to Keycloak user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    login_db: "{{ keycloak_db_name }}"
    role: "{{ keycloak_db_user }}"
    type: schema
    objs: public
    privs: ALL
    state: present
  when:
    - keycloak_db_name is defined
    - keycloak_db_user is defined
    - keycloak_db_password is defined
  tags: ['runtime-config']
