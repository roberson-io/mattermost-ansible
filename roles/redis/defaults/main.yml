---
# Redis role default variables

# Version and download configuration (Redis 7.x as recommended by Mattermost)
redis_version: "7.4.2"
redis_download_url: "https://download.redis.io/releases/redis-{{ redis_version }}.tar.gz"
redis_install_path: "/opt/redis"

# Redis network configuration
redis_bind_address: "0.0.0.0"  # Listen on all interfaces (use firewall to restrict)
redis_port: 6379
redis_protected_mode: "yes"  # Enabled for security; requirepass must be set
redis_tcp_backlog: 511
redis_timeout: 0
redis_tcp_keepalive: 300

# Redis authentication
redis_requirepass: ""  # Set via group_vars or host_vars for security

# Redis persistence configuration
redis_save_enabled: true
redis_save_intervals:
  - "900 1"    # Save after 900 seconds (15 min) if at least 1 key changed
  - "300 10"   # Save after 300 seconds (5 min) if at least 10 keys changed
  - "60 10000" # Save after 60 seconds if at least 10000 keys changed
redis_stop_writes_on_bgsave_error: "yes"
redis_rdbcompression: "yes"
redis_rdbchecksum: "yes"
redis_dbfilename: "dump.rdb"
redis_dir: "/var/lib/redis"

# Redis memory management
redis_maxmemory: "256mb"  # Adjust based on available system memory
redis_maxmemory_policy: "allkeys-lru"  # Eviction policy for Mattermost cache
redis_maxmemory_samples: 5

# Redis logging
redis_loglevel: "notice"
redis_logfile: "/var/log/redis/redis.log"
redis_syslog_enabled: "no"

# Redis performance tuning
redis_databases: 16
redis_slowlog_log_slower_than: 10000  # Microseconds
redis_slowlog_max_len: 128
redis_hz: 10

# Redis replication (disabled by default)
redis_replication_enabled: false
redis_replica_read_only: "yes"
redis_repl_backlog_size: "1mb"

# Redis security
redis_disable_commands: []  # List of commands to disable (e.g., FLUSHDB, FLUSHALL)

# Firewall configuration
redis_firewall_enabled: true
redis_firewall_allowed_sources: []  # List of IP addresses or CIDR ranges to allow
