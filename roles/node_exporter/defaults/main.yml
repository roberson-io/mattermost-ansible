---
# Node Exporter role default variables

# Node Exporter version
node_exporter_version: "1.8.2"
node_exporter_download_url: >-
  https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz

# Installation paths
node_exporter_install_path: "/opt/node_exporter"

# System user and group
node_exporter_user: "node_exporter"
node_exporter_group: "node_exporter"
node_exporter_system_user: true

# Service configuration
node_exporter_listen_address: "0.0.0.0:9100"

# Firewall configuration
node_exporter_configure_firewall: true
node_exporter_firewall_port: 9100
node_exporter_firewall_allowed_sources: []
