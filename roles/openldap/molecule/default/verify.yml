---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Check if OpenLDAP service is running
      ansible.builtin.systemd:
        name: slapd-test
      register: service_status
      failed_when: service_status.status.ActiveState != 'active'

    - name: Check if OpenLDAP is listening on port 389
      ansible.builtin.wait_for:
        port: 389
        timeout: 10

    - name: Test LDAP search (anonymous bind)
      ansible.builtin.command: >
        ldapsearch -x -H ldap://localhost:389 -b "dc=test,dc=example,dc=com" -LLL
      register: ldap_search
      changed_when: false
      failed_when: ldap_search.rc != 0

    - name: Verify base DN exists in search results
      ansible.builtin.assert:
        that:
          - "'dc=test,dc=example,dc=com' in ldap_search.stdout"
        fail_msg: "Base DN not found in LDAP search results"
        success_msg: "OpenLDAP is working correctly"

    - name: Verify organizational units exist
      ansible.builtin.assert:
        that:
          - "'ou=People' in ldap_search.stdout"
          - "'ou=Groups' in ldap_search.stdout"
        fail_msg: "Organizational units not found"
        success_msg: "Organizational structure is correct"
