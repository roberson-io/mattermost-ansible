---
# openldap role default variables

# Instance identification
openldap_instance_name: "ldap"

# Version and download configuration
openldap_version: "2.6.10"  # LTS version
openldap_download_url: "https://www.openldap.org/software/download/OpenLDAP/openldap-release/openldap-{{ openldap_version }}.tgz"
openldap_install_path: "/opt/openldap"

# Network configuration
openldap_port: 389
openldap_tls_port: 636
openldap_listen_address: "0.0.0.0"

# Directory configuration
openldap_base_dn: "dc=example,dc=com"
openldap_organization: "Example Organization"
openldap_domain: "example.com"
openldap_admin_cn: "admin"
openldap_admin_password: "{{ vault_openldap_admin_password }}"
openldap_config_password: "{{ vault_openldap_config_password }}"

# Installation paths
openldap_data_dir: "/var/lib/openldap"
openldap_config_dir: "/etc/openldap"
openldap_schema_dir: "{{ openldap_install_path }}/etc/openldap/schema"
openldap_log_dir: "/var/log/openldap"
openldap_run_dir: "/var/run/openldap"

# Service configuration
openldap_user: ldap
openldap_group: ldap

# Schemas to load (core is always loaded automatically)
openldap_schemas:
  - cosine
  - inetorgperson
  - nis

# TLS/LDAPS configuration
openldap_tls_enabled: false
openldap_tls_cert_file: ""
openldap_tls_key_file: ""
openldap_tls_ca_file: ""

# Logging configuration
# Levels: none(0), stats(256), packets(2), args(4), conns(8), BER(16), filter(32),
#         config(64), ACL(128), sync(16384), any(-1)
openldap_log_level: "stats"

# Database backend
openldap_database_type: "mdb"  # Modern LMDB backend
openldap_database_max_size: 1073741824  # 1GB default

# Access control rules (basic default - allows self-write, auth, and read)
openldap_access_rules:
  - "to attrs=userPassword by self write by anonymous auth by * none"
  - "to attrs=shadowLastChange by self write by * read"
  - "to * by * read"

# Index configuration for performance
openldap_indexes:
  - "objectClass eq"
  - "uid eq,pres,sub"
  - "cn eq,pres,sub"
  - "sn eq,pres,sub"
  - "mail eq,pres,sub"
  - "ou eq,pres,sub"
  - "dc eq"
  - "entryCSN eq"
  - "entryUUID eq"
