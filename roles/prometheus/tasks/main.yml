---
# Prometheus installation and configuration tasks

- name: Create Prometheus system group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: "{{ prometheus_system_user }}"
    state: present

- name: Create Prometheus system user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: "{{ prometheus_system_user }}"
    shell: /usr/sbin/nologin
    home: "{{ prometheus_data_dir }}"
    create_home: false
    state: present

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  loop:
    - "{{ prometheus_install_path }}"
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_data_dir }}"

- name: Check if Prometheus is already installed
  ansible.builtin.stat:
    path: "{{ prometheus_install_path }}/prometheus"
  register: prometheus_binary

- name: Get installed Prometheus version
  ansible.builtin.command:
    cmd: "{{ prometheus_install_path }}/prometheus --version"
  register: prometheus_installed_version
  changed_when: false
  failed_when: false
  when: prometheus_binary.stat.exists

- name: Set fact for version check
  ansible.builtin.set_fact:
    prometheus_needs_install: >-
      {{ not prometheus_binary.stat.exists or
         'prometheus, version ' + prometheus_version not in prometheus_installed_version.stdout }}

- name: Download Prometheus binary
  ansible.builtin.get_url:
    url: "{{ prometheus_download_url }}"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"
  when: prometheus_needs_install

- name: Extract Prometheus binary
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: "/tmp"
    remote_src: true
  when: prometheus_needs_install

- name: Copy Prometheus binaries to install path
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "{{ prometheus_install_path }}/{{ item }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  when: prometheus_needs_install
  notify: Restart prometheus

- name: Check if console files exist
  ansible.builtin.stat:
    path: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/consoles"
  register: prometheus_consoles_exist
  when: prometheus_needs_install

- name: Copy Prometheus console files
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "{{ prometheus_config_dir }}/{{ item }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
    remote_src: true
  loop:
    - consoles
    - console_libraries
  when:
    - prometheus_needs_install
    - prometheus_consoles_exist.stat.exists

- name: Remove temporary files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    - "/tmp/prometheus-{{ prometheus_version }}.linux-amd64"
  when: prometheus_needs_install

- name: Build Mattermost targets list from inventory
  ansible.builtin.set_fact:
    prometheus_mattermost_targets: >-
      {{ groups.app | map('extract', hostvars, ['ansible_default_ipv4', 'address']) |
         map('regex_replace', '^(.*)$', '\1:8067') | list }}
  when:
    - groups.app is defined
    - groups.app | length > 0

- name: Build node_exporter targets list from inventory
  ansible.builtin.set_fact:
    prometheus_node_exporter_targets: >-
      {{ groups.app | map('extract', hostvars, ['ansible_default_ipv4', 'address']) |
         map('regex_replace', '^(.*)$', '\1:9100') | list }}
  when:
    - groups.app is defined
    - groups.app | length > 0

- name: Create Prometheus configuration file
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  notify: Restart prometheus

- name: Copy Prometheus alerting rules
  ansible.builtin.copy:
    src: alerts.yml
    dest: "{{ prometheus_config_dir }}/alerts.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  notify: Restart prometheus

- name: Create Prometheus systemd service
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart prometheus

- name: Enable and start Prometheus service
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

- name: Deploy nginx configuration for Prometheus
  ansible.builtin.template:
    src: nginx-prometheus.conf.j2
    dest: /etc/nginx/sites-available/prometheus.conf
    owner: root
    group: root
    mode: "0644"
  when: prometheus_enable_nginx
  notify: Restart nginx

- name: Enable nginx site for Prometheus
  ansible.builtin.file:
    src: /etc/nginx/sites-available/prometheus.conf
    dest: /etc/nginx/sites-enabled/prometheus.conf
    state: link
  when: prometheus_enable_nginx
  notify: Restart nginx

- name: Configure firewall for Prometheus (firewalld)
  ansible.posix.firewalld:
    port: "{{ prometheus_firewall_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when:
    - prometheus_configure_firewall | bool
    - ansible_os_family == "RedHat"
  failed_when: false

- name: Configure firewall for Prometheus (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ prometheus_firewall_port }}"
    proto: tcp
  when:
    - prometheus_configure_firewall | bool
    - ansible_os_family == "Debian"
  failed_when: false
