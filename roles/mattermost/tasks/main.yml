---
- name: Include OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags: ['install']

#
# Set hostname from inventory (required for HA cluster node identification)
#
- name: Set system hostname from inventory
  ansible.builtin.hostname:
    name: "{{ (inventory_hostname.split('@')[-2] if '@orb' in inventory_hostname else inventory_hostname.split('@')[-1].split('.')[0]) }}"
  when:
    - mattermost_enable_cluster | default(false)
    - inventory_hostname != ansible_hostname
  tags: ['runtime-config']

- name: Update apt cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  tags: ['install']

- name: Remove curl-minimal if present (RedHat/Rocky)
  ansible.builtin.package:
    name: curl-minimal
    state: absent
  when: ansible_os_family == "RedHat"
  failed_when: false
  tags: ['install']

- name: Install required packages
  ansible.builtin.package:
    name: "{{ mattermost_packages }}"
    state: present
  tags: ['install']

- name: Check if Mattermost is already installed
  ansible.builtin.stat:
    path: "{{ mattermost_install_path }}/bin/mattermost"
  register: mattermost_binary
  tags: ['install']

- name: Get current Mattermost version
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      {{ mattermost_install_path }}/bin/mattermost version | grep '^Version:' | awk '{print $2}'
    executable: /bin/bash
  register: mattermost_current_version
  changed_when: false
  failed_when: false
  when: mattermost_binary.stat.exists
  tags: ['install']

- name: Set version comparison facts
  ansible.builtin.set_fact:
    mattermost_needs_install: "{{ not mattermost_binary.stat.exists }}"
    mattermost_needs_upgrade: >-
      {{ mattermost_binary.stat.exists and
         mattermost_current_version.stdout is defined and
         mattermost_current_version.stdout | length > 0 and
         mattermost_current_version.stdout != mattermost_version }}
    mattermost_installed_version: "{{ mattermost_current_version.stdout | default('none') }}"
  tags: ['install']

- name: Display version information
  ansible.builtin.debug:
    msg:
      - "Current version: {{ mattermost_installed_version }}"
      - "Desired version: {{ mattermost_version }}"
      - >-
        Action needed: {{ 'fresh install' if mattermost_needs_install
        else ('upgrade/downgrade' if mattermost_needs_upgrade
        else 'none (already at desired version)') }}
  tags: ['install']

- name: Stop Mattermost for upgrade/downgrade
  ansible.builtin.systemd:
    name: mattermost
    state: stopped
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Ensure backup directory exists on database host
  ansible.builtin.file:
    path: "{{ mattermost_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  delegate_to: "{{ (groups['database'] | default([]))[0] | default(inventory_hostname) }}"
  become: true
  when:
    - mattermost_needs_upgrade
    - groups.get('database', []) | length > 0
    - not (mattermost_skip_db_backup | default(false))
  tags: ['runtime-config']

- name: Backup database before upgrade/downgrade
  community.postgresql.postgresql_db:
    name: "{{ mattermost_db_name }}"
    state: dump
    target: "{{ mattermost_backup_dir }}/mattermost-db-backup-{{ ansible_date_time.iso8601_basic_short }}.sql"
  delegate_to: "{{ (groups['database'] | default([]))[0] | default(inventory_hostname) }}"
  become: true
  become_user: postgres
  register: mattermost_db_backup
  when:
    - mattermost_needs_upgrade
    - groups.get('database', []) | length > 0
    - not (mattermost_skip_db_backup | default(false))
  tags: ['runtime-config']

- name: Backup Mattermost application directory
  ansible.builtin.copy:
    src: "{{ mattermost_install_path }}/"
    dest: "{{ mattermost_install_path }}-back-{{ ansible_date_time.date }}-{{ ansible_date_time.hour }}-{{ ansible_date_time.minute }}"
    remote_src: true
    owner: mattermost
    group: mattermost
    mode: "0755"
  register: mattermost_app_backup
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Remove old Mattermost tarball for upgrade/downgrade
  ansible.builtin.file:
    path: /tmp/mattermost.tar.gz
    state: absent
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Download Mattermost
  ansible.builtin.get_url:
    url: "https://releases.mattermost.com/{{ mattermost_version }}/mattermost-{{ mattermost_version }}-linux-amd64.tar.gz"
    dest: /tmp/mattermost.tar.gz
    mode: "0644"
    force: true
    timeout: 300
  when: mattermost_needs_install or mattermost_needs_upgrade
  tags: ['install']

- name: Extract Mattermost (fresh install)
  ansible.builtin.unarchive:
    src: /tmp/mattermost.tar.gz
    dest: /opt
    remote_src: true
    creates: "{{ mattermost_install_path }}"
  when: mattermost_needs_install
  tags: ['install']

- name: Extract new Mattermost version to temporary location
  ansible.builtin.unarchive:
    src: /tmp/mattermost.tar.gz
    dest: /tmp
    remote_src: true
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Remove old Mattermost files
  ansible.builtin.shell: |
    cd {{ mattermost_install_path }}
    sudo find . -mindepth 1 -maxdepth 1 \
      ! -name 'config' \
      ! -name 'data' \
      ! -name 'logs' \
      ! -name 'plugins' \
      ! -name 'client' \
      -exec rm -rf {} \;
  changed_when: true
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Remove old client directory contents (except plugins)
  ansible.builtin.shell: |
    cd {{ mattermost_install_path }}/client
    sudo find . -mindepth 1 -maxdepth 1 \
      ! -name 'plugins' \
      -exec rm -rf {} \;
  changed_when: true
  when: mattermost_needs_upgrade
  failed_when: false
  tags: ['install']

- name: Copy new Mattermost files from temp to installation directory
  ansible.builtin.shell: |
    sudo cp -an /tmp/mattermost/. {{ mattermost_install_path }}/
  changed_when: true
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Remove temporary Mattermost extraction
  ansible.builtin.file:
    path: /tmp/mattermost
    state: absent
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Set ownership of Mattermost files after upgrade
  ansible.builtin.file:
    path: "{{ mattermost_install_path }}"
    owner: mattermost
    group: mattermost
    recurse: true
  when: mattermost_needs_upgrade
  tags: ['configure-base']

- name: Display upgrade completion message
  ansible.builtin.debug:
    msg:
      - "=========================================="
      - "Mattermost upgrade/downgrade complete!"
      - "Previous version: {{ mattermost_installed_version }}"
      - "New version: {{ mattermost_version }}"
      - "Application backup: {{ mattermost_app_backup.dest | default('N/A') }}"
      - "Database backup: {{ mattermost_backup_dir }}/mattermost-db-backup-{{ ansible_date_time.iso8601_basic_short }}.sql (on database host)"
      - "=========================================="
      - "NOTE: Users may need to refresh their browsers"
  when: mattermost_needs_upgrade
  tags: ['install']

- name: Create mattermost user
  ansible.builtin.user:
    name: mattermost
    system: true
    shell: /bin/bash
    home: "{{ mattermost_install_path }}"
    createhome: false
  tags: ['configure-base']

- name: Create Mattermost data directory
  ansible.builtin.file:
    path: "{{ mattermost_install_path }}/data"
    state: directory
    owner: mattermost
    group: mattermost
    mode: "0755"
  tags: ['configure-base']

- name: Set Mattermost directory ownership
  ansible.builtin.file:
    path: "{{ mattermost_install_path }}"
    owner: mattermost
    group: mattermost
    recurse: true
  tags: ['configure-base']

# SELinux configuration (per Mattermost documentation)
- name: Set SELinux file context policy for Mattermost directory
  community.general.sefcontext:
    target: "{{ mattermost_install_path }}(/.*)?"
    setype: httpd_sys_content_t
    state: present
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"
  tags: ['configure-base']

- name: Set SELinux file context policy for Mattermost binaries
  community.general.sefcontext:
    target: "{{ mattermost_install_path }}/bin(/.*)?"
    setype: bin_t
    state: present
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"
  tags: ['configure-base']

- name: Set SELinux file context policy for Mattermost config directory
  community.general.sefcontext:
    target: "{{ mattermost_install_path }}/config(/.*)?"
    setype: etc_t
    state: present
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"
  tags: ['configure-base']

- name: Apply SELinux context to Mattermost installation
  ansible.builtin.command:
    cmd: restorecon -RF {{ mattermost_install_path }}
  changed_when: false
  when:
    - ansible_os_family == "RedHat"
    - ansible_selinux.status == "enabled"
  tags: ['configure-base']

#
# fapolicyd configuration (RHEL 8+)
#
- name: Check if fapolicyd is installed
  ansible.builtin.stat:
    path: /usr/sbin/fapolicyd
  register: mattermost_fapolicyd_binary
  tags: ['configure-base']

- name: Get list of all plugin binaries
  ansible.builtin.find:
    paths: "{{ mattermost_install_path }}/plugins"
    patterns: "plugin-linux-*"
    recurse: true
    file_type: file
  register: mattermost_plugin_binaries
  when:
    - ansible_os_family == "RedHat"
    - mattermost_fapolicyd_binary.stat.exists
  tags: ['configure-base']

- name: Add Mattermost binaries to fapolicyd trust database
  ansible.builtin.shell:
    cmd: |
      fapolicyd-cli --file add {{ mattermost_install_path }}/bin/mattermost
      fapolicyd-cli --file add {{ mattermost_install_path }}/bin/mmctl
      {% for plugin in mattermost_plugin_binaries.files | default([]) %}
      fapolicyd-cli --file add {{ plugin.path }}
      {% endfor %}
      fapolicyd-cli --update
  changed_when: true
  when:
    - ansible_os_family == "RedHat"
    - mattermost_fapolicyd_binary.stat.exists
  notify: Restart mattermost
  tags: ['configure-base']

#
# System limits configuration for HA cluster (optional)
#
- name: Configure system limits for Mattermost user (max open files)
  community.general.pam_limits:
    domain: mattermost
    limit_type: "{{ item }}"
    limit_item: nofile
    value: "{{ mattermost_max_open_files }}"
  loop:
    - soft
    - hard
  when: mattermost_configure_system_limits | default(false)
  tags: ['configure-base']

- name: Configure system limits for Mattermost user (max processes)
  community.general.pam_limits:
    domain: mattermost
    limit_type: "{{ item }}"
    limit_item: nproc
    value: "{{ mattermost_max_processes }}"
  loop:
    - soft
    - hard
  when: mattermost_configure_system_limits | default(false)
  tags: ['configure-base']

- name: Display system limits configuration status
  ansible.builtin.debug:
    msg:
      - "System limits configured for HA cluster"
      - "Max open files: {{ mattermost_max_open_files }}"
      - "Max processes: {{ mattermost_max_processes }}"
  when: mattermost_configure_system_limits | default(false)
  tags: ['configure-base']

#
# TCP/IP network optimizations for HA cluster (optional)
#
- name: Configure TCP/IP network optimizations for HA cluster
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop:
    - { name: "net.ipv4.tcp_tw_reuse", value: "1" }
    - { name: "net.ipv4.ip_local_port_range", value: "10000 65000" }
    - { name: "net.ipv4.tcp_fin_timeout", value: "30" }
    - { name: "net.ipv4.tcp_keepalive_time", value: "300" }
    - { name: "net.ipv4.tcp_keepalive_probes", value: "5" }
    - { name: "net.ipv4.tcp_keepalive_intvl", value: "15" }
    - { name: "net.core.somaxconn", value: "1024" }
    - { name: "net.core.netdev_max_backlog", value: "5000" }
  when: mattermost_configure_network_optimizations | default(false)
  tags: ['configure-base']

- name: Display network optimizations configuration status
  ansible.builtin.debug:
    msg: "TCP/IP network optimizations configured for HA cluster"
  when: mattermost_configure_network_optimizations | default(false)
  tags: ['configure-base']

- name: Debug database host value
  ansible.builtin.debug:
    msg: "Database host will be: {{ mattermost_db_host | default('UNDEFINED') }}"
  tags: ['runtime-config']

# Detect current configuration storage mode
- name: Check if environment file exists (indicates database mode was previously used)
  ansible.builtin.stat:
    path: "{{ mattermost_install_path }}/config/mattermost.environment"
  register: mattermost_env_file_stat
  tags: ['runtime-config']

- name: Check if MM_CONFIG is set in systemd service
  ansible.builtin.shell: grep -q "EnvironmentFile=" /etc/systemd/system/mattermost.service || echo "not-found"
  register: mattermost_systemd_envfile_check
  changed_when: false
  failed_when: false
  when: mattermost_env_file_stat.stat.exists
  tags: ['runtime-config']

- name: Determine previous configuration mode
  ansible.builtin.set_fact:
    mattermost_previous_mode: "{{ 'database' if (mattermost_env_file_stat.stat.exists and mattermost_systemd_envfile_check.rc == 0) else 'file' }}"
  tags: ['runtime-config']

- name: Detect configuration mode change
  ansible.builtin.set_fact:
    mattermost_mode_changed: "{{ mattermost_previous_mode != mattermost_config_storage }}"
  tags: ['runtime-config']

- name: Display migration information
  ansible.builtin.debug:
    msg: "Configuration storage migration: {{ mattermost_previous_mode }} -> {{ mattermost_config_storage }}"
  when: mattermost_mode_changed | bool
  tags: ['runtime-config']

# Migration: File to Database
- name: Migrate configuration from file to database
  when:
    - mattermost_mode_changed | bool
    - mattermost_previous_mode == "file"
    - mattermost_config_storage == "database"
    - mattermost_binary.stat.exists
  block:
    - name: Deploy environment file for migration
      ansible.builtin.template:
        src: mattermost.environment.j2
        dest: "{{ mattermost_install_path }}/config/mattermost.environment"
        owner: mattermost
        group: mattermost
        mode: "0600"
      tags: ['runtime-config']

    - name: Update systemd service for database mode
      ansible.builtin.template:
        src: mattermost.service.j2
        dest: /etc/systemd/system/mattermost.service
        mode: "0644"
      notify:
        - Reload systemd
        - Restart mattermost
      tags: ['runtime-config']

    - name: Flush handlers to restart with database config
      ansible.builtin.meta: flush_handlers

    - name: Wait for Mattermost to be ready for migration
      ansible.builtin.uri:
        url: "http://localhost:8065/api/v4/system/ping"
        status_code: 200
      register: mattermost_migrate_ping
      until: mattermost_migrate_ping.status == 200
      retries: 30
      delay: 2

    - name: Migrate config.json to database using mmctl
      ansible.builtin.command:
        cmd: >
          {{ mattermost_install_path }}/bin/mmctl --local config migrate
          {{ mattermost_install_path }}/config/config.json
          'postgres://{{ mattermost_db_user }}:{{ mattermost_db_password }}@{{ mattermost_db_host }}:{{ mattermost_db_port }}/
          {{ mattermost_db_name }}?sslmode={{ mattermost_db_sslmode }}&connect_timeout=10'
      become: true
      become_user: mattermost
      register: mattermost_migrate_to_db
      changed_when: "'Successfully migrated' in mattermost_migrate_to_db.stdout or mattermost_migrate_to_db.rc == 0"
      failed_when: false

    - name: Display migration result
      ansible.builtin.debug:
        msg: "Migration to database result: {{ mattermost_migrate_to_db.stdout }}"

# Migration: Database to File
- name: Migrate configuration from database to file
  when:
    - mattermost_mode_changed | bool
    - mattermost_previous_mode == "database"
    - mattermost_config_storage == "file"
    - mattermost_binary.stat.exists
  tags: ['runtime-config']
  block:
    - name: Remove environment file
      ansible.builtin.file:
        path: "{{ mattermost_install_path }}/config/mattermost.environment"
        state: absent

    - name: Update systemd service for file mode
      ansible.builtin.template:
        src: mattermost.service.j2
        dest: /etc/systemd/system/mattermost.service
        mode: "0644"
      notify:
        - Reload systemd
        - Restart mattermost

    - name: Flush handlers to restart with file config
      ansible.builtin.meta: flush_handlers

    - name: Wait for Mattermost to be ready after switching to file mode
      ansible.builtin.uri:
        url: "http://localhost:8065/api/v4/system/ping"
        status_code: 200
      register: mattermost_file_mode_ping
      until: mattermost_file_mode_ping.status == 200
      retries: 30
      delay: 2

    - name: Backup current config.json
      ansible.builtin.copy:
        src: "{{ mattermost_install_path }}/config/config.json"
        dest: "{{ mattermost_install_path }}/config/config.json.pre-migration"
        remote_src: true
        owner: mattermost
        group: mattermost
        mode: "0600"

    - name: Export database configuration to file using mmctl
      ansible.builtin.shell: >
        {{ mattermost_install_path }}/bin/mmctl --local config show > {{ mattermost_install_path }}/config/config.json.tmp
      become: true
      become_user: mattermost
      register: mattermost_export_config
      changed_when: true

    - name: Replace config.json with exported configuration
      ansible.builtin.copy:
        src: "{{ mattermost_install_path }}/config/config.json.tmp"
        dest: "{{ mattermost_install_path }}/config/config.json"
        remote_src: true
        owner: mattermost
        group: mattermost
        mode: "0600"
      when: mattermost_export_config.rc == 0
      notify: Restart mattermost

    - name: Remove temporary config file
      ansible.builtin.file:
        path: "{{ mattermost_install_path }}/config/config.json.tmp"
        state: absent

# File-based configuration (config.json)
- name: Configure Mattermost with file-based storage
  when:
    - mattermost_config_storage == "file"
    - not (mattermost_mode_changed | bool)
  tags: ['runtime-config']
  block:
    - name: Configure Mattermost database connection
      ansible.builtin.replace:
        path: "{{ mattermost_install_path }}/config/config.json"
        regexp: '"DataSource":\s*"postgres://[^"]*"'
        replace: >-
          "DataSource": "postgres://{{ mattermost_db_user }}:{{ mattermost_db_password }}@{{
          mattermost_db_host }}:{{ mattermost_db_port }}/{{ mattermost_db_name }}?sslmode={{ mattermost_db_sslmode }}&connect_timeout=10"

    - name: Configure Mattermost site URL
      ansible.builtin.replace:
        path: "{{ mattermost_install_path }}/config/config.json"
        regexp: '"SiteURL":\s*"[^"]*"'
        replace: '"SiteURL": "{{ mattermost_site_url }}"'

    - name: Enable local mode for mmctl
      ansible.builtin.replace:
        path: "{{ mattermost_install_path }}/config/config.json"
        regexp: '"EnableLocalMode":\s*(true|false)'
        replace: '"EnableLocalMode": true'
      notify: Restart mattermost

    - name: Check current rtcd URL configuration
      ansible.builtin.shell: |
        jq -r '.PluginSettings.Plugins."com.mattermost.calls".rtcdserviceurl // "not-set"' \
          {{ mattermost_install_path }}/config/config.json
      register: mattermost_current_rtcd_url
      changed_when: false
      when:
        - enable_calls | default(false)
        - mattermost_rtcd_host is defined

    - name: Configure Mattermost Calls rtcd URL
      ansible.builtin.shell: |
        jq '.PluginSettings.Plugins."com.mattermost.calls".rtcdserviceurl = "http://{{ mattermost_rtcd_host }}:8045"' \
          {{ mattermost_install_path }}/config/config.json > {{ mattermost_install_path }}/config/config.json.tmp && \
        mv {{ mattermost_install_path }}/config/config.json.tmp {{ mattermost_install_path }}/config/config.json && \
        chown mattermost:mattermost {{ mattermost_install_path }}/config/config.json
      when:
        - enable_calls | default(false)
        - mattermost_rtcd_host is defined
        - mattermost_current_rtcd_url.stdout != "http://" + mattermost_rtcd_host + ":8045"
      changed_when: true
      notify: Restart mattermost

# Database-based configuration (MM_CONFIG environment variable)
- name: Configure Mattermost with database storage
  when:
    - mattermost_config_storage == "database"
    - not (mattermost_mode_changed | bool)
  tags: ['runtime-config']
  block:
    - name: Deploy Mattermost environment file for database config
      ansible.builtin.template:
        src: mattermost.environment.j2
        dest: "{{ mattermost_install_path }}/config/mattermost.environment"
        owner: mattermost
        group: mattermost
        mode: "0600"
      notify: Restart mattermost

- name: Deploy environment file for database configuration mode
  ansible.builtin.template:
    src: mattermost.environment.j2
    dest: "{{ mattermost_install_path }}/config/mattermost.environment"
    owner: mattermost
    group: mattermost
    mode: "0600"
  tags: ['runtime-config']
  when: mattermost_config_storage == "database"
  notify: Restart mattermost

- name: Create Mattermost systemd service
  ansible.builtin.template:
    src: mattermost.service.j2
    dest: /etc/systemd/system/mattermost.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart mattermost
  tags: ['configure-base']

- name: Enable Mattermost service
  ansible.builtin.systemd:
    name: mattermost
    enabled: true

  tags: ['service-start']
- name: Flush handlers before starting Mattermost
  ansible.builtin.meta: flush_handlers

  tags: ['service-start']
- name: Start Mattermost service
  ansible.builtin.systemd:
    name: mattermost
    state: started
  tags: ['service-start']
  register: mattermost_start
  failed_when: false
  changed_when: mattermost_start is changed

- name: Check if ufw is available (Debian/Ubuntu)
  ansible.builtin.command: which ufw
  tags: ['configure-base']
  register: mattermost_ufw_check
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Debian"

- name: Allow Mattermost port through firewall (ufw - Debian/Ubuntu)
  community.general.ufw:
    rule: allow
    port: "8065"
    proto: tcp
  tags: ['configure-base']
  when:
    - ansible_os_family == "Debian"
    - mattermost_ufw_check.rc == 0

- name: Check if firewalld is available (RedHat)
  ansible.builtin.command: which firewall-cmd
  tags: ['configure-base']
  register: mattermost_firewalld_check
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"

- name: Allow Mattermost port through firewall (firewalld - RedHat)
  ansible.posix.firewalld:
    port: 8065/tcp
    permanent: true
    state: enabled
    immediate: true
  tags: ['configure-base']
  when:
    - ansible_os_family == "RedHat"
    - mattermost_firewalld_check.rc == 0

# Note: When using database-based configuration storage, initial configuration
# is stored in the database. The Mattermost server will start with defaults and
# can be configured via the System Console UI or mmctl after deployment.

# License activation (optional)
- name: Flush handlers to ensure Mattermost is restarted with local mode enabled
  ansible.builtin.meta: flush_handlers
  tags: ['runtime-config']
  when: mattermost_config_storage == "file"

- name: Wait for Mattermost to be ready (file config mode)
  ansible.builtin.uri:
    url: "http://localhost:8065/api/v4/system/ping"
    status_code: 200
  tags: ['runtime-config']
  register: mattermost_ping
  until: mattermost_ping.status == 200
  retries: 30
  delay: 2
  when:
    - mattermost_license_file | length > 0
    - mattermost_config_storage == "file"

- name: Wait for Mattermost to be ready (database config mode for license)
  ansible.builtin.uri:
    url: "http://localhost:8065/api/v4/system/ping"
    status_code: 200
  tags: ['runtime-config']
  register: mattermost_db_license_ping
  until: mattermost_db_license_ping.status == 200
  retries: 30
  delay: 2
  when:
    - mattermost_license_file | length > 0
    - mattermost_config_storage == "database"

- name: Copy license file to server
  ansible.builtin.copy:
    src: "{{ mattermost_license_file }}"
    dest: "/tmp/mattermost.license"
    owner: mattermost
    group: mattermost
    mode: "0600"
  tags: ['runtime-config']
  when: mattermost_license_file | length > 0

- name: Upload license using mmctl
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl
      --local license upload /tmp/mattermost.license
  become: true
  become_user: mattermost
  tags: ['runtime-config']
  register: mattermost_license_upload
  changed_when: "'uploaded' in mattermost_license_upload.stdout.lower()"
  failed_when: false
  when: mattermost_license_file | length > 0

- name: Remove temporary license file
  ansible.builtin.file:
    path: "/tmp/mattermost.license"
    state: absent
  tags: ['runtime-config']
  when: mattermost_license_file | length > 0

- name: Display license upload result
  ansible.builtin.debug:
    msg: "License upload: {{ mattermost_license_upload.stdout | default('No output') }}"
  tags: ['runtime-config']
  when: mattermost_license_file | length > 0

#
# Redis cache configuration (optional)
#

# Disable Redis if mattermost_enable_redis is false
- name: Check current cache type
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config get CacheSettings.CacheType
  become: true
  become_user: mattermost
  register: mattermost_current_cache_type
  changed_when: false
  failed_when: false
  run_once: true
  when: not (mattermost_enable_redis | default(false))
  tags: ['runtime-config']

- name: Revert to LRU cache when Redis is disabled
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set CacheSettings.CacheType lru
  become: true
  become_user: mattermost
  changed_when: true
  register: mattermost_redis_disabled
  run_once: true
  when:
    - not (mattermost_enable_redis | default(false))
    - "'lru' not in mattermost_current_cache_type.stdout | lower"
  tags: ['runtime-config']

- name: Clear Redis address when Redis is disabled
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set CacheSettings.RedisAddress ""
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - not (mattermost_enable_redis | default(false))
    - mattermost_redis_disabled is changed
  tags: ['runtime-config']

- name: Clear Redis password when Redis is disabled
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set CacheSettings.RedisPassword ""
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - not (mattermost_enable_redis | default(false))
    - mattermost_redis_disabled is changed
  no_log: true
  tags: ['runtime-config']

- name: Restart Mattermost to apply cache type change
  ansible.builtin.systemd:
    name: mattermost
    state: restarted
  become: true
  throttle: 1
  when:
    - not (mattermost_enable_redis | default(false))
    - mattermost_redis_disabled is changed
  tags: ['runtime-config']

- name: Wait for Mattermost to be ready after disabling Redis
  ansible.builtin.uri:
    url: "http://localhost:8065/api/v4/system/ping"
    status_code: 200
  register: mattermost_ping_no_redis
  until: mattermost_ping_no_redis.status == 200
  retries: 30
  delay: 2
  when: not (mattermost_enable_redis | default(false))
  tags: ['runtime-config']

