#
# Boards plugin installation (optional)
#
- name: Wait for Mattermost to be ready (for Boards plugin)
  ansible.builtin.uri:
    url: "http://localhost:8065/api/v4/system/ping"
    status_code: 200
  register: mattermost_boards_ping
  until: mattermost_boards_ping.status == 200
  retries: 30
  delay: 2
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Enable plugin uploads (required for Boards plugin)
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set PluginSettings.EnableUploads true
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Enable plugins (required for Boards plugin)
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set PluginSettings.Enable true
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Check if Boards plugin is already installed (cluster-wide check)
  ansible.builtin.stat:
    path: "{{ mattermost_install_path }}/plugins/focalboard"
  register: mattermost_boards_plugin_installed
  run_once: true
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Get current Boards plugin version (cluster-wide check)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      {{ mattermost_install_path }}/bin/mmctl --local plugin list | grep focalboard | awk -F', Version: ' '{print $2}'
    executable: /bin/bash
  become: true
  become_user: mattermost
  register: mattermost_boards_current_version
  changed_when: false
  failed_when: false
  run_once: true
  when:
    - mattermost_enable_boards | default(false)
    - mattermost_boards_plugin_installed.stat.exists
  tags: ['runtime-config']

- name: Set Boards plugin version facts (cluster-wide)
  ansible.builtin.set_fact:
    mattermost_mattermost_boards_installed_version: >-
      {{ mattermost_boards_current_version.stdout | default('none') }}
    mattermost_boards_needs_upgrade: >-
      {{ mattermost_boards_plugin_installed.stat.exists and
      mattermost_boards_current_version.stdout != mattermost_boards_version }}
    mattermost_boards_needs_install: >-
      {{ not mattermost_boards_plugin_installed.stat.exists }}
  run_once: true
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Display Boards plugin version information
  ansible.builtin.debug:
    msg:
      - "Current Boards version: {{ mattermost_mattermost_boards_installed_version | default('none') }}"
      - "Desired Boards version: {{ mattermost_boards_version }}"
      - >-
        Action needed: {{ 'fresh install' if mattermost_boards_needs_install
        else ('upgrade/downgrade' if mattermost_boards_needs_upgrade
        else 'none (already at desired version)') }}
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Remove old Boards plugin for upgrade/downgrade
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local plugin delete
      focalboard
  become: true
  become_user: mattermost
  register: mattermost_boards_remove
  changed_when: mattermost_boards_remove.rc == 0
  failed_when: false
  run_once: true
  when:
    - mattermost_enable_boards | default(false)
    - mattermost_boards_needs_upgrade | default(false)
  tags: ['runtime-config']

- name: Set Boards download URL
  ansible.builtin.set_fact:
    mattermost_boards_url: "\
      https://github.com/mattermost/mattermost-plugin-boards/releases/download/\
      v{{ mattermost_boards_version }}/\
      mattermost-plugin-boards-v{{ mattermost_boards_version }}-linux-amd64.tar.gz"
  when:
    - mattermost_enable_boards | default(false)
    - mattermost_boards_needs_install | default(false) or mattermost_boards_needs_upgrade | default(false)
  tags: ['runtime-config']

- name: Download Boards plugin
  ansible.builtin.get_url:
    url: "{{ mattermost_boards_url }}"
    dest: "/tmp/mattermost-plugin-boards-v{{ mattermost_boards_version }}.tar.gz"
    mode: "0644"
    timeout: 120
  run_once: true
  when:
    - mattermost_enable_boards | default(false)
    - mattermost_boards_needs_install | default(false) or mattermost_boards_needs_upgrade | default(false)
  tags: ['runtime-config']

- name: Install Boards plugin using mmctl
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local plugin add
      /tmp/mattermost-plugin-boards-v{{ mattermost_boards_version }}.tar.gz
  become: true
  become_user: mattermost
  register: mattermost_boards_install
  changed_when: "'Uploaded' in mattermost_boards_install.stdout or mattermost_boards_install.rc == 0"
  failed_when: mattermost_boards_install.rc != 0 and 'already exists' not in mattermost_boards_install.stderr
  run_once: true
  when:
    - mattermost_enable_boards | default(false)
    - mattermost_boards_needs_install | default(false) or mattermost_boards_needs_upgrade | default(false)
  tags: ['runtime-config']

- name: Enable Boards plugin
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local plugin enable
      focalboard
  become: true
  become_user: mattermost
  register: mattermost_boards_enable
  changed_when: "'Enabled' in mattermost_boards_enable.stdout or mattermost_boards_enable.rc == 0"
  failed_when: mattermost_boards_enable.rc != 0 and 'already enabled' not in mattermost_boards_enable.stderr
  run_once: true
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Remove temporary Boards plugin file
  ansible.builtin.file:
    path: "/tmp/mattermost-plugin-boards-v{{ mattermost_boards_version }}.tar.gz"
    state: absent
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

- name: Display Boards plugin installation status
  ansible.builtin.debug:
    msg: "Mattermost Boards plugin v{{ mattermost_boards_version }} installed and enabled"
  when: mattermost_enable_boards | default(false)
  tags: ['runtime-config']

#
# High Availability cluster configuration (optional)
#
- name: Validate cluster prerequisites - database config storage
  ansible.builtin.fail:
    msg: >
      High Availability cluster requires database config storage.
      Set mattermost_config_storage: "database" in your group_vars.
  when:
    - mattermost_enable_cluster | default(false)
    - mattermost_config_storage != "database"
  tags: ['runtime-config']

- name: Validate cluster prerequisites - shared file storage
  ansible.builtin.fail:
    msg: >
      High Availability cluster requires shared file storage (S3/MinIO or NFS).
      Set either mattermost_enable_s3: true or mattermost_enable_nfs: true in your group_vars.
  when:
    - mattermost_enable_cluster | default(false)
    - not (mattermost_enable_s3 | default(false))
    - not (mattermost_enable_nfs | default(false))
  tags: ['runtime-config']

- name: Gather facts from all app nodes for cluster discovery
  ansible.builtin.setup:
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups.app | default([]) }}"
  when:
    - mattermost_enable_cluster | default(false)
    - groups.app | default([]) | length > 1
  tags: ['runtime-config']

- name: Build cluster node list
  ansible.builtin.set_fact:
    mattermost_cluster_nodes: >-
      {{ groups.app | default([])
         | map('extract', hostvars, ['ansible_default_ipv4', 'address'])
         | list }}
  when:
    - mattermost_enable_cluster | default(false)
    - groups.app | default([]) | length > 1
  tags: ['runtime-config']

- name: Display cluster node information
  ansible.builtin.debug:
    msg:
      - "Configuring HA cluster with {{ mattermost_cluster_nodes | length }} nodes"
      - "Cluster nodes: {{ mattermost_cluster_nodes | join(', ') }}"
      - "Cluster name: {{ mattermost_cluster_name }}"
      - "Gossip port: {{ mattermost_gossip_port }}"
  when:
    - mattermost_enable_cluster | default(false)
    - groups.app | default([]) | length > 1
  tags: ['runtime-config']

- name: Get current cluster configuration
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      MMCTL="{{ mattermost_install_path }}/bin/mmctl --local config get"
      echo "Enable=$($MMCTL ClusterSettings.Enable 2>/dev/null | grep -oP '(?<=: )\w+' || echo 'false')"
      echo "ClusterName=$($MMCTL ClusterSettings.ClusterName 2>/dev/null | grep -oP '(?<=: ).*' || echo '')"
      echo "UseIPAddress=$($MMCTL ClusterSettings.UseIPAddress 2>/dev/null | grep -oP '(?<=: )\w+' || echo 'true')"
      echo "GossipPort=$($MMCTL ClusterSettings.GossipPort 2>/dev/null | grep -oP '(?<=: )\d+' || echo '8074')"
      echo "ReadOnlyConfig=$($MMCTL ClusterSettings.ReadOnlyConfig 2>/dev/null | grep -oP '(?<=: )\w+' || echo 'true')"
  args:
    executable: /bin/bash
  become: true
  become_user: mattermost
  register: mattermost_current_cluster_config
  changed_when: false
  failed_when: false
  run_once: true
  when: mattermost_enable_cluster | default(false)
  tags: ['runtime-config']

- name: Parse current cluster configuration
  ansible.builtin.set_fact:
    mattermost_cluster_current:
      enable: "{{ mattermost_current_cluster_config.stdout_lines | select('match', '^Enable=') | first | regex_replace('^Enable=', '') }}"
      cluster_name: "{{ mattermost_current_cluster_config.stdout_lines | select('match', '^ClusterName=') | first | regex_replace('^ClusterName=', '') }}"
      use_ip: "{{ mattermost_current_cluster_config.stdout_lines | select('match', '^UseIPAddress=') | first | regex_replace('^UseIPAddress=', '') }}"
      gossip_port: "{{ mattermost_current_cluster_config.stdout_lines | select('match', '^GossipPort=') | first | regex_replace('^GossipPort=', '') }}"
      readonly: "{{ mattermost_current_cluster_config.stdout_lines | select('match', '^ReadOnlyConfig=') | first | regex_replace('^ReadOnlyConfig=', '') }}"
  run_once: true
  when: mattermost_enable_cluster | default(false)
  tags: ['runtime-config']

- name: Enable cluster mode
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set ClusterSettings.Enable true
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - mattermost_enable_cluster | default(false)
    - mattermost_cluster_current.enable != 'true'
  tags: ['runtime-config']

- name: Configure cluster name
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set ClusterSettings.ClusterName {{ mattermost_cluster_name }}
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - mattermost_enable_cluster | default(false)
    - mattermost_cluster_current.cluster_name != mattermost_cluster_name
  tags: ['runtime-config']

- name: Configure cluster to use IP address
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set ClusterSettings.UseIPAddress {{ mattermost_cluster_use_ip_address | lower }}
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - mattermost_enable_cluster | default(false)
    - mattermost_cluster_current.use_ip != (mattermost_cluster_use_ip_address | lower | string)
  tags: ['runtime-config']

- name: Configure cluster override hostname
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set ClusterSettings.OverrideHostname {{ mattermost_cluster_override_hostname }}
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - mattermost_enable_cluster | default(false)
    - mattermost_cluster_override_hostname | default('') | length > 0
  tags: ['runtime-config']

- name: Configure gossip port
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set ClusterSettings.GossipPort {{ mattermost_gossip_port }}
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - mattermost_enable_cluster | default(false)
    - mattermost_cluster_current.gossip_port != (mattermost_gossip_port | string)
  tags: ['runtime-config']

- name: Configure read-only config
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set ClusterSettings.ReadOnlyConfig {{ mattermost_cluster_read_only_config | lower }}
  become: true
  become_user: mattermost
  changed_when: true
  run_once: true
  when:
    - mattermost_enable_cluster | default(false)
    - mattermost_cluster_current.readonly != (mattermost_cluster_read_only_config | lower | string)
  tags: ['runtime-config']

- name: Check if firewalld is available
  ansible.builtin.command: which firewall-cmd
  register: mattermost_firewalld_check
  changed_when: false
  failed_when: false
  when:
    - mattermost_enable_cluster | default(false)
    - ansible_os_family == "RedHat"
  tags: ['runtime-config']

- name: Configure firewall for gossip port (firewalld)
  ansible.posix.firewalld:
    port: "{{ mattermost_gossip_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when:
    - mattermost_enable_cluster | default(false)
    - ansible_os_family == "RedHat"
    - mattermost_firewalld_check.rc == 0
  tags: ['runtime-config']

- name: Configure firewall for streaming port (firewalld)
  ansible.posix.firewalld:
    port: "{{ mattermost_streaming_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when:
    - mattermost_enable_cluster | default(false)
    - ansible_os_family == "RedHat"
    - mattermost_firewalld_check.rc == 0
  tags: ['runtime-config']

- name: Check if ufw is available
  ansible.builtin.command: which ufw
  register: mattermost_ufw_check
  changed_when: false
  failed_when: false
  when:
    - mattermost_enable_cluster | default(false)
    - ansible_os_family == "Debian"
  tags: ['runtime-config']

- name: Configure firewall for gossip port (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ mattermost_gossip_port }}"
    proto: tcp
  when:
    - mattermost_enable_cluster | default(false)
    - ansible_os_family == "Debian"
    - mattermost_ufw_check.rc == 0
  tags: ['runtime-config']

- name: Configure firewall for streaming port (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ mattermost_streaming_port }}"
    proto: tcp
  when:
    - mattermost_enable_cluster | default(false)
    - ansible_os_family == "Debian"
    - mattermost_ufw_check.rc == 0
  tags: ['runtime-config']

- name: Restart Mattermost to apply cluster configuration
  ansible.builtin.systemd:
    name: mattermost
    state: restarted
  become: true
  throttle: 1
  when: mattermost_enable_cluster | default(false)
  tags: ['runtime-config']

- name: Wait for Mattermost to be ready after cluster config
  ansible.builtin.uri:
    url: "http://localhost:8065/api/v4/system/ping"
    status_code: 200
  register: mattermost_cluster_ping
  until: mattermost_cluster_ping.status == 200
  retries: 30
  delay: 2
  when: mattermost_enable_cluster | default(false)
  tags: ['runtime-config']

- name: Display cluster configuration status
  ansible.builtin.debug:
    msg:
      - "High Availability cluster configured"
      - "Cluster name: {{ mattermost_cluster_name }}"
      - "Cluster nodes: {{ mattermost_cluster_nodes | default([inventory_hostname]) | length }}"
      - "Gossip port: {{ mattermost_gossip_port }}"
      - "Streaming port: {{ mattermost_streaming_port }}"
  when: mattermost_enable_cluster | default(false)
  tags: ['runtime-config']

#
# Database read replicas configuration (optional)
#
- name: Configure database read replicas
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set SqlSettings.DataSourceReplicas '{{ mattermost_db_replicas | to_json }}'
  become: true
  become_user: mattermost
  changed_when: true
  when:
    - mattermost_db_replicas | default([]) | length > 0
  tags: ['runtime-config']

- name: Configure database search replicas
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set SqlSettings.DataSourceSearchReplicas '{{ mattermost_db_search_replicas | to_json }}'
  become: true
  become_user: mattermost
  changed_when: true
  when:
    - mattermost_db_search_replicas | default([]) | length > 0
  tags: ['runtime-config']

- name: Restart Mattermost to apply database replica configuration
  ansible.builtin.systemd:
    name: mattermost
    state: restarted
  become: true
  when:
    - (mattermost_db_replicas | default([]) | length > 0) or (mattermost_db_search_replicas | default([]) | length > 0)
  tags: ['runtime-config']

- name: Wait for Mattermost to be ready after replica config
  ansible.builtin.uri:
    url: "http://localhost:8065/api/v4/system/ping"
    status_code: 200
  register: mattermost_replica_ping
  until: mattermost_replica_ping.status == 200
  retries: 30
  delay: 2
  when:
    - (mattermost_db_replicas | default([]) | length > 0) or (mattermost_db_search_replicas | default([]) | length > 0)
  tags: ['runtime-config']

- name: Display database replica configuration status
  ansible.builtin.debug:
    msg:
      - "Database read replicas configured: {{ mattermost_db_replicas | length }}"
      - "Database search replicas configured: {{ mattermost_db_search_replicas | length }}"
  when:
    - (mattermost_db_replicas | default([]) | length > 0) or (mattermost_db_search_replicas | default([]) | length > 0)
  tags: ['runtime-config']

# ============================================================================
# Calls Plugin Configuration
# ============================================================================

- name: Get current Mattermost configuration
  ansible.builtin.command:
    cmd: "{{ mattermost_install_path }}/bin/mmctl --local config show --json"
  become: true
  become_user: mattermost
  register: mattermost_current_config
  changed_when: false
  when:
    - mattermost_enable_calls | bool
  tags: ['runtime-config']

- name: Build Calls plugin configuration updates
  ansible.builtin.set_fact:
    mattermost_calls_config_patch:
      PluginSettings:
        PluginStates:
          com.mattermost.calls:
            Enable: true
        Plugins:
          com.mattermost.calls:
            rtcdserviceurl: "{{ mattermost_calls_rtcd_url }}"
            enablerecordings: "{{ mattermost_calls_enable_recording }}"
            jobserviceurl: "{{ mattermost_calls_job_service_url }}"
            recordingquality: "{{ mattermost_calls_recording_quality }}"
            maxrecordingduration: "{{ mattermost_calls_max_recording_duration }}"
            enabletranscriptions: "{{ mattermost_calls_enable_transcriptions }}"
            transcribermodelsize: "{{ mattermost_calls_transcriber_model_size }}"
            transcribernumthreads: "{{ mattermost_calls_transcriber_num_threads }}"
            transcribeapi: "{{ mattermost_calls_transcribe_api }}"
            enablelivecaptions: "{{ mattermost_calls_enable_live_captions }}"
            livecaptionsmodelsize: "{{ mattermost_calls_live_captions_model_size }}"
            livecaptionslanguage: "{{ mattermost_calls_live_captions_language }}"
            icehostoverride: "{{ mattermost_calls_ice_host_override }}"
            udpserverport: "{{ mattermost_calls_udp_server_port }}"
            tcpserverport: "{{ mattermost_calls_tcp_server_port }}"
            enableipv6: "{{ mattermost_calls_enable_ipv6 }}"
            enableringing: "{{ mattermost_calls_enable_ringing }}"
            maxcallparticipants: "{{ mattermost_calls_max_call_participants }}"
            allowscreensharing: "{{ mattermost_calls_allow_screen_sharing }}"
  when:
    - mattermost_enable_calls | bool
  tags: ['runtime-config']

- name: Merge Calls configuration with current config
  ansible.builtin.set_fact:
    mattermost_updated_config: "{{ mattermost_current_config.stdout | from_json | combine(mattermost_calls_config_patch, recursive=true) }}"
  when:
    - mattermost_enable_calls | bool
  tags: ['runtime-config']

- name: Write updated configuration to temp file
  ansible.builtin.copy:
    content: "{{ mattermost_updated_config | to_nice_json }}"
    dest: "/tmp/mattermost_config_patch.json"
    owner: mattermost
    group: mattermost
    mode: '0600'
  when:
    - mattermost_enable_calls | bool
  tags: ['runtime-config']

- name: Apply Calls plugin configuration via mmctl config patch
  ansible.builtin.command:
    cmd: "{{ mattermost_install_path }}/bin/mmctl --local config patch /tmp/mattermost_config_patch.json"
  become: true
  become_user: mattermost
  register: mattermost_calls_patch_result
  changed_when: true
  when:
    - mattermost_enable_calls | bool
  tags: ['runtime-config']

- name: Remove temporary config file
  ansible.builtin.file:
    path: "/tmp/mattermost_config_patch.json"
    state: absent
  when:
    - mattermost_enable_calls | bool
  tags: ['runtime-config']

# Performance monitoring configuration
- name: Enable performance monitoring in Mattermost
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set
      MetricsSettings.Enable true
  become: true
  become_user: mattermost
  changed_when: true
  when:
    - mattermost_enable_performance_monitoring | bool
  tags: ['runtime-config']

- name: Set performance monitoring listen address
  ansible.builtin.command:
    cmd: >
      {{ mattermost_install_path }}/bin/mmctl --local config set
      MetricsSettings.ListenAddress {{ mattermost_performance_monitoring_listen_address }}
  become: true
  become_user: mattermost
  changed_when: true
  when:
    - mattermost_enable_performance_monitoring | bool
  tags: ['runtime-config']

- name: Configure firewall for performance monitoring (firewalld)
  ansible.posix.firewalld:
    port: "{{ mattermost_performance_monitoring_listen_address.split(':')[1] }}/tcp"
    permanent: true
    state: enabled
    immediate: true
    source: "{{ item }}"
  loop: "{{ groups['monitoring'] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | list }}"
  when:
    - mattermost_enable_performance_monitoring | bool
    - ansible_os_family == "RedHat"
    - groups['monitoring'] is defined
    - groups['monitoring'] | length > 0
  failed_when: false
  tags: ['runtime-config']

- name: Configure firewall for performance monitoring (ufw)
  community.general.ufw:
    rule: allow
    port: "{{ mattermost_performance_monitoring_listen_address.split(':')[1] }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ groups['monitoring'] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | list }}"
  when:
    - mattermost_enable_performance_monitoring | bool
    - ansible_os_family == "Debian"
    - groups['monitoring'] is defined
    - groups['monitoring'] | length > 0
  failed_when: false
  tags: ['runtime-config']
