---
# Mattermost role default variables
mattermost_version: "10.12.0"
mattermost_install_path: /opt/mattermost

# Configuration storage mode
# Options: "file" (default) or "database"
# - "file": Configuration stored in config.json (suitable for single-server)
# - "database": Configuration stored in database (recommended for HA clusters)
mattermost_config_storage: "file"

# Database connection (can be overridden in group_vars)
mattermost_db_host: localhost
mattermost_db_port: 5432
mattermost_db_name: mattermost
mattermost_db_user: mmuser
mattermost_db_password: "mmuser_password_change_me"

# Database read replicas for HA (optional)
# List of read replica connection strings for load balancing read queries
# Format: "postgres://user:password@host:port/dbname?sslmode=disable"
# Example:
#   mattermost_db_replicas:
#     - "postgres://mmuser:password@replica1.example.com:5432/mattermost?sslmode=disable"
#     - "postgres://mmuser:password@replica2.example.com:5432/mattermost?sslmode=disable"
mattermost_db_replicas: []

# Database search replicas for HA (optional)
# Dedicated replicas for search queries to isolate search load
# Same format as mattermost_db_replicas
mattermost_db_search_replicas: []

# Site configuration
mattermost_site_url: "http://{{ ansible_default_ipv4.address }}:8065"
mattermost_listen_address: ":8065"

# Backup configuration
mattermost_backup_dir: "/var/backups/mattermost"  # Directory for database backups

# License configuration (optional)
mattermost_license_file: ""  # Path to license file (e.g., license.mattermost)
mattermost_service_environment: "production"  # Required: production, test, or dev

# Boards plugin configuration (optional)
mattermost_enable_boards: false  # Set to true to install Mattermost Boards plugin
mattermost_boards_version: "9.1.6"  # Version of Boards plugin to install

# Redis cache configuration (optional)
mattermost_enable_redis: false  # Set to true to enable Redis cache
mattermost_redis_host: ""  # Redis host address (e.g., redis-host:6379)
mattermost_redis_password: ""  # Redis password (leave empty if no auth)

# S3/MinIO object storage configuration (optional)
mattermost_enable_s3: false  # Set to true to enable S3/MinIO for file storage
mattermost_s3_endpoint: ""  # S3 endpoint URL (e.g., minio-host:9000 for MinIO)
mattermost_s3_bucket: "mattermost"  # S3 bucket name
mattermost_s3_region: "us-east-1"  # S3 region
mattermost_s3_access_key_id: ""  # S3 access key ID
mattermost_s3_secret_access_key: ""  # S3 secret access key
mattermost_s3_secure: true  # Use HTTPS for S3 endpoint
mattermost_s3_path_prefix: ""  # Optional path prefix within bucket

# Elasticsearch/OpenSearch configuration (optional)
mattermost_enable_elasticsearch: false  # Set to true to enable Elasticsearch
mattermost_elasticsearch_host: ""  # Elasticsearch host address (e.g., elasticsearch-host:9200)
mattermost_elasticsearch_username: ""  # Elasticsearch username (for ES8)
mattermost_elasticsearch_password: ""  # Elasticsearch password (for ES8)
mattermost_elasticsearch_skip_tls_verification: false  # Skip TLS verification
mattermost_elasticsearch_ca_path: ""  # Path to custom CA certificate file (PEM format, e.g., ./elasticsearch/ca.pem)
mattermost_elasticsearch_client_cert_path: ""  # Path to client certificate for mTLS (PEM format, e.g., ./elasticsearch/client-cert.pem)
mattermost_elasticsearch_client_key_path: ""  # Path to client certificate key for mTLS (PEM format, e.g., ./elasticsearch/client-key.pem)
mattermost_elasticsearch_enable_indexing: true  # Enable automatic indexing
mattermost_elasticsearch_enable_searching: true  # Enable search queries
mattermost_elasticsearch_enable_autocomplete: true  # Enable autocomplete
mattermost_elasticsearch_sniff: false  # Enable sniffing (cluster discovery)

# High Availability cluster configuration (optional)
# Requires: mattermost_config_storage: "database" and mattermost_enable_s3: true
mattermost_enable_cluster: false  # Set to true to enable HA cluster mode
mattermost_cluster_name: "production"  # Name of the cluster (e.g., production, staging)
mattermost_cluster_use_ip_address: true  # Use IP addresses instead of hostnames for cluster communication
mattermost_cluster_override_hostname: ""  # Optional: Manually set the advertise address (leave empty for auto-detect)
mattermost_gossip_port: 8074  # Port for gossip protocol communication between cluster nodes
mattermost_streaming_port: 8075  # Port for streaming API communication between cluster nodes
mattermost_cluster_read_only_config: true  # Make config.json read-only (recommended for HA)

# System limits for HA cluster (recommended by Mattermost)
mattermost_configure_system_limits: false  # Set to true to configure system limits for HA
mattermost_max_open_files: 65536  # Maximum open files (ulimit -n)
mattermost_max_processes: 8192  # Maximum processes (ulimit -u)
