---
dependency:
  enabled: false
  name: galaxy

driver:
  name: docker

platforms:
  - name: mattermost-db
    image: postgres:14
    env:
      POSTGRES_PASSWORD: mmuser_password_change_me
      POSTGRES_USER: mmuser
      POSTGRES_DB: mattermost
    command: ""
    pre_build_image: true

  - name: mattermost-app
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - app

provisioner:
  name: ansible
  inventory:
    group_vars:
      app:
        mattermost_db_host: mattermost-db
        mattermost_db_port: 5432
        mattermost_db_name: mattermost
        mattermost_db_user: mmuser
        mattermost_db_password: mmuser_password_change_me
        mattermost_site_url: "http://localhost:8065"
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer, yaml
      host_key_checking: false
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ssh_connection:
      pipelining: false

verifier:
  name: ansible

scenario:
  name: migrate-to-db
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
