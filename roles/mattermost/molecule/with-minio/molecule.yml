---
dependency:
  enabled: false
  name: galaxy

driver:
  name: docker

platforms:
  - name: mattermost-db
    image: postgres:14
    env:
      POSTGRES_PASSWORD: mmuser_password_change_me
      POSTGRES_USER: mmuser
      POSTGRES_DB: mattermost
    command: ""
    pre_build_image: true

  - name: minio-server
    image: minio/minio:latest
    env:
      MINIO_ROOT_USER: miniotestuser
      MINIO_ROOT_PASSWORD: miniotestpass123
    command: "server /data --console-address :9001"
    published_ports:
      - "9000:9000"
      - "9001:9001"
    pre_build_image: true

  - name: mattermost-app
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    groups:
      - app

provisioner:
  name: ansible
  inventory:
    group_vars:
      app:
        mattermost_db_host: mattermost-db
        mattermost_db_port: 5432
        mattermost_db_name: mattermost
        mattermost_db_user: mmuser
        mattermost_db_password: mmuser_password_change_me
        mattermost_site_url: "http://localhost:8065"
        mattermost_enable_s3: true
        mattermost_s3_endpoint: "minio-server:9000"
        mattermost_s3_bucket: "mattermost-test"
        mattermost_s3_region: "us-east-1"
        mattermost_s3_access_key_id: "miniotestuser"
        mattermost_s3_secret_access_key: "miniotestpass123"
        mattermost_s3_secure: false
  config_options:
    defaults:
      interpreter_python: auto_silent
      callback_whitelist: profile_tasks, timer, yaml
      host_key_checking: false
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ssh_connection:
      pipelining: false

verifier:
  name: ansible

scenario:
  name: with-minio
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
