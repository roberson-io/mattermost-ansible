[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
# Enable profiling callbacks to identify slow tasks
# Note: stig_xml is only used when disa_stig_enabled=true
callbacks_enabled = profile_tasks, timer, stig_xml
# Increase forks for better parallelism (adjust based on control node capacity)
forks = 10
# Callback plugin paths (for STIG XML reporting)
callback_plugins = ./roles/rhel9STIG/callback_plugins

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# SSH connection reuse for faster execution
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
